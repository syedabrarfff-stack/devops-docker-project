name: JARVIS — Backend Tests

# Runs the pytest suite on every push and PR touching the backend. This is
# intentionally a separate, fast-feedback workflow from ec2-deploy.yml —
# deployment currently builds and starts containers directly on the EC2
# instance via docker-compose, with no test execution anywhere in that path.
# This workflow is the actual test gate; treat a red check here as a real
# signal, not noise.

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        working-directory: backend
        env:
          # CI-only dummy values so config.py's startup validation is satisfied
          # without needing real secrets. DEBUG + the explicit opt-in flag let
          # config.py skip the insecure-default checks that are correct to
          # enforce in production but irrelevant to running unit tests.
          DEBUG: "true"
          ALLOW_INSECURE_DEV_DEFAULTS: "true"
          SECRET_KEY: "ci-test-secret-key-not-used-in-production-0000000000"
          CAPTAIN_USERNAME: "captain"
          CAPTAIN_PASSWORD: "ci-test-password-not-used-in-production"
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_test_db"
        run: |
          python -m pytest -v --tb=short
