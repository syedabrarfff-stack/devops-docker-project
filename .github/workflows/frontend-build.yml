name: JARVIS — Frontend Build

# Runs a real production Vite build on every push and PR touching the
# frontend. Deployment builds the frontend directly on the EC2 instance via
# docker-compose with no build verification anywhere before that — this is
# the actual gate that catches a broken import or JSX syntax error before it
# reaches production, not after.

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
