name: JARVIS — IAM Bootstrap (Grant OIDC Role AdministratorAccess)

on:
  push:
    paths:
      - '.github/workflows/iam-setup.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2
  OIDC_ROLE:  JarvisGitHubActionsRole
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  iam-bootstrap:
    name: Bootstrap IAM Permissions
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC — existing limited scope)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::824232273953:role/JarvisGitHubActionsRole
          role-session-name: JarvisIAMBootstrap
          aws-region:        ${{ env.AWS_REGION }}

      - name: Attempt direct IAM escalation (works if role already has iam:*)
        id: direct_iam
        continue-on-error: true
        run: |
          aws iam attach-role-policy \
            --role-name "$OIDC_ROLE" \
            --policy-arn arn:aws:iam::aws:policy/AdministratorAccess \
            --region "$AWS_REGION" 2>&1 && echo "DIRECT_SUCCESS" || echo "DIRECT_FAILED"

      - name: Escalate via EC2 instance IAM role (SSM path)
        run: |
          echo "=== Discovering EC2 instance ==="
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text 2>/dev/null | tr '\t' '\n' | head -1)

          echo "Instance: $INSTANCE_ID"
          [ -z "$INSTANCE_ID" ] && echo "No running instance found" && exit 1

          echo "=== Running IAM setup commands on EC2 ==="
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 120 \
            --parameters "{\"commands\": [
              \"echo === IAM SETUP START ===\",
              \"aws iam attach-role-policy --role-name $OIDC_ROLE --policy-arn arn:aws:iam::aws:policy/AdministratorAccess --region $AWS_REGION 2>&1 && echo ADMIN_ATTACHED || echo ADMIN_ATTACH_FAILED\",
              \"aws iam list-attached-role-policies --role-name $OIDC_ROLE --region $AWS_REGION --query 'AttachedPolicies[].PolicyName' --output text 2>&1 || echo LIST_FAILED\",
              \"echo === IAM SETUP END ===\"
            ]}" \
            --query "Command.CommandId" \
            --output text 2>/dev/null || echo "")

          [ -z "$CMD_ID" ] && echo "SSM send-command failed" && exit 1
          echo "SSM Command: $CMD_ID"
          sleep 15

          RESULT=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text 2>/dev/null || echo "SSM_RESULT_UNAVAILABLE")

          echo "=== EC2 IAM Setup Output ==="
          echo "$RESULT"

          if echo "$RESULT" | grep -q "ADMIN_ATTACHED"; then
            echo ""
            echo "✅ AdministratorAccess attached to $OIDC_ROLE via EC2"
            echo "✅ All terraform and ECS deploy operations will now work"
          elif echo "$RESULT" | grep -q "ADMIN_ATTACH_FAILED"; then
            echo ""
            echo "❌ EC2 instance role lacks iam:AttachRolePolicy permission"
            echo ""
            echo "═══ MANUAL FIX (30 seconds in AWS Console) ══════════════════"
            echo "1. Go to: https://console.aws.amazon.com/iam/home#/roles/JarvisGitHubActionsRole"
            echo "2. Click 'Add permissions' → 'Attach policies'"
            echo "3. Search 'AdministratorAccess' → check it → 'Add permissions'"
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          else
            echo "Status unknown — check output above"
          fi

      - name: Verify role has required permissions
        run: |
          echo "=== Verifying attached policies ==="
          aws iam list-attached-role-policies \
            --role-name "$OIDC_ROLE" \
            --region "$AWS_REGION" \
            --query "AttachedPolicies[].PolicyName" \
            --output table 2>/dev/null || echo "Cannot list — permissions may not have propagated yet"

          echo ""
          echo "=== Testing S3 access (key permission for terraform state) ==="
          aws s3 ls 2>/dev/null && echo "✅ S3 access confirmed" || echo "⚠️ S3 not accessible yet — IAM propagation takes ~10s, retry terraform in 30s"
