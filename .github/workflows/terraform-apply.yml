name: JARVIS — Terraform Apply (ECS Infrastructure)

on:
  push:
    branches:
      - claude/jarvis-cans-api-integration-ZThTD
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: false
        default: apply
        type: choice
        options: [apply, plan-only, destroy]
      db_password:
        description: RDS PostgreSQL password
        required: false
        default: ""
        type: string
      secret_key:
        description: FastAPI SECRET_KEY (hex string)
        required: false
        default: ""
        type: string
      captain_password:
        description: Captain login password
        required: false
        default: ""
        type: string

env:
  AWS_REGION: ap-south-2
  OIDC_ROLE:  arn:aws:iam::824232273953:role/JarvisGitHubActionsRole
  TF_STATE_BUCKET: jarvis-terraform-state-824232273953
  TF_LOCK_TABLE:   jarvis-terraform-locks
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.OIDC_ROLE }}
          role-session-name: JarvisTerraformApply
          aws-region:        ${{ env.AWS_REGION }}

      - name: Bootstrap S3 state bucket + DynamoDB lock table
        id: s3_bootstrap
        continue-on-error: true
        run: |
          echo "=== Creating S3 state bucket if not exists ==="
          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" 2>/dev/null; then
            echo "Bucket already exists"
          else
            aws s3api create-bucket \
              --bucket "$TF_STATE_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION" && \
            echo "Bucket created" || { echo "S3_CREATE_FAILED"; exit 1; }
          fi

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled 2>/dev/null || true

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' 2>/dev/null || true

          echo "=== Creating DynamoDB lock table if not exists ==="
          aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$AWS_REGION" 2>/dev/null || \
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"

          echo "S3_BACKEND_READY=true" >> $GITHUB_ENV
          echo "State bucket and lock table ready."

      - name: Restore terraform state from cache (fallback when no S3)
        if: steps.s3_bootstrap.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: infra/terraform/terraform.tfstate
          key: terraform-state-production

      - name: Install Terraform 1.9.0
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Build terraform.tfvars from inputs + Secrets Manager + EC2 .env
        working-directory: infra/terraform
        env:
          INPUT_DB_PASSWORD:       ${{ github.event.inputs.db_password }}
          INPUT_SECRET_KEY:        ${{ github.event.inputs.secret_key }}
          INPUT_CAPTAIN_PASSWORD:  ${{ github.event.inputs.captain_password }}
        run: |
          echo "=== Resolving variable values ==="

          # ── 1. Try Secrets Manager ────────────────────────────────────────
          SM_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "jarvis-production/env" \
            --region "$AWS_REGION" \
            --query SecretString --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$SM_SECRET" != "NOT_FOUND" ]; then
            echo "Source: Secrets Manager jarvis-production/env"
            SM_DB_URL=$(echo "$SM_SECRET"     | python3 -c "import json,sys; print(json.load(sys.stdin).get('DATABASE_URL',''))" 2>/dev/null || echo "")
            SM_SECRET_KEY=$(echo "$SM_SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin).get('SECRET_KEY',''))" 2>/dev/null || echo "")
            SM_CAPTAIN_PW=$(echo "$SM_SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin).get('CAPTAIN_PASSWORD',''))" 2>/dev/null || echo "")
            SM_DB_PW=$(echo "$SM_DB_URL"      | python3 -c "import sys,re; url=sys.stdin.read().strip(); m=re.search(r'://[^:]+:([^@]+)@', url); print(m.group(1) if m else '')" 2>/dev/null || echo "")
          else
            echo "Source: Secrets Manager not found — reading from EC2 .env via SSM"
            SM_SECRET_KEY=""
            SM_CAPTAIN_PW=""
            SM_DB_PW=""

            # ── 2. Fall back to EC2's .env via SSM ───────────────────────
            INSTANCE_ID=$(aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text 2>/dev/null | tr '\t' '\n' | head -1 || echo "")

            if [ -n "$INSTANCE_ID" ]; then
              CMD_ID=$(aws ssm send-command \
                --region "$AWS_REGION" \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --timeout-seconds 30 \
                --parameters '{"commands":["cat /opt/jarvis/.env 2>/dev/null || cat /home/ubuntu/devops-docker-project/.env 2>/dev/null || echo ENV_NOT_FOUND"]}' \
                --query "Command.CommandId" --output text 2>/dev/null || echo "")

              if [ -n "$CMD_ID" ]; then
                sleep 8
                EC2_ENV=$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" --output text 2>/dev/null || echo "")

                # Parse .env format: KEY=value or KEY="value"
                get_env() {
                  echo "$EC2_ENV" | grep "^$1=" | head -1 | sed "s/^$1=//;s/^['\"]//;s/['\"]$//"
                }

                SM_DB_URL=$(get_env DATABASE_URL)
                SM_SECRET_KEY=$(get_env SECRET_KEY)
                SM_CAPTAIN_PW=$(get_env CAPTAIN_PASSWORD)
                SM_DB_PW=$(echo "$SM_DB_URL" | python3 -c "import sys,re; url=sys.stdin.read().strip(); m=re.search(r'://[^:]+:([^@]+)@', url); print(m.group(1) if m else '')" 2>/dev/null || echo "")
                echo "Successfully read values from EC2 .env"
              fi
            fi
          fi

          # ── 3. Use workflow_dispatch inputs if provided ───────────────────
          DB_PASSWORD="${INPUT_DB_PASSWORD:-${SM_DB_PW}}"
          SECRET_KEY="${INPUT_SECRET_KEY:-${SM_SECRET_KEY}}"
          CAPTAIN_PASSWORD="${INPUT_CAPTAIN_PASSWORD:-${SM_CAPTAIN_PW}}"

          # ── 4. Generate secure randoms only if truly empty ────────────────
          [ -z "$DB_PASSWORD" ]      && DB_PASSWORD=$(openssl rand -hex 16) && echo "WARN: Generated random db_password — record this!"
          [ -z "$SECRET_KEY" ]       && SECRET_KEY=$(openssl rand -hex 32)
          [ -z "$CAPTAIN_PASSWORD" ] && CAPTAIN_PASSWORD=$(openssl rand -base64 24 | tr -d '+/=') && echo "WARN: Generated random captain_password — record this!"

          # ── Mask all secrets from logs ────────────────────────────────────
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$CAPTAIN_PASSWORD"

          echo "=== Writing terraform.tfvars ==="
          # Read remaining API keys from Secrets Manager if available
          ANTHROPIC_KEY=""
          NVIDIA_KEY=""
          STRIPE_SECRET=""
          STRIPE_PUB=""
          SLACK_URL=""
          TG_TOKEN=""
          TG_CHAT=""
          GOOGLE_MAPS=""
          if [ "$SM_SECRET" != "NOT_FOUND" ]; then
            ANTHROPIC_KEY=$(echo "$SM_SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin).get('ANTHROPIC_API_KEY',''))" 2>/dev/null || echo "")
            NVIDIA_KEY=$(echo "$SM_SECRET"    | python3 -c "import json,sys; print(json.load(sys.stdin).get('NVIDIA_API_KEY',''))" 2>/dev/null || echo "")
            STRIPE_SECRET=$(echo "$SM_SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin).get('STRIPE_SECRET_KEY',''))" 2>/dev/null || echo "")
            STRIPE_PUB=$(echo "$SM_SECRET"    | python3 -c "import json,sys; print(json.load(sys.stdin).get('STRIPE_PUBLISHABLE_KEY',''))" 2>/dev/null || echo "")
            SLACK_URL=$(echo "$SM_SECRET"     | python3 -c "import json,sys; print(json.load(sys.stdin).get('SLACK_WEBHOOK_URL',''))" 2>/dev/null || echo "")
            TG_TOKEN=$(echo "$SM_SECRET"      | python3 -c "import json,sys; print(json.load(sys.stdin).get('TELEGRAM_BOT_TOKEN',''))" 2>/dev/null || echo "")
            TG_CHAT=$(echo "$SM_SECRET"       | python3 -c "import json,sys; print(json.load(sys.stdin).get('TELEGRAM_CHAT_ID',''))" 2>/dev/null || echo "")
            GOOGLE_MAPS=$(echo "$SM_SECRET"   | python3 -c "import json,sys; print(json.load(sys.stdin).get('GOOGLE_MAPS_API_KEY',''))" 2>/dev/null || echo "")
          fi

          # Mask additional secrets
          [ -n "$ANTHROPIC_KEY" ] && echo "::add-mask::$ANTHROPIC_KEY"
          [ -n "$STRIPE_SECRET" ] && echo "::add-mask::$STRIPE_SECRET"
          [ -n "$SLACK_URL" ]     && echo "::add-mask::$SLACK_URL"
          [ -n "$TG_TOKEN" ]      && echo "::add-mask::$TG_TOKEN"

          cat > terraform.tfvars <<TFVARS
          project     = "jarvis"
          environment = "production"
          aws_region  = "ap-south-2"
          domain_name = "aliyarsolutions.com"

          secret_key               = "${SECRET_KEY}"
          captain_username         = "captain"
          captain_password         = "${CAPTAIN_PASSWORD}"
          jarvis_default_tenant_id = "794d9b02-2dd6-49f0-b5c1-9f7c0b3af4b1"

          db_password       = "${DB_PASSWORD}"
          db_instance_class = "db.t3.small"
          db_storage_gb     = 20

          redis_node_type = "cache.t3.micro"

          anthropic_api_key   = "${ANTHROPIC_KEY}"
          openai_api_key      = ""
          deepseek_api_key    = ""
          groq_api_key        = ""
          mistral_api_key     = ""
          moonshot_api_key    = ""
          zhipuai_api_key     = ""
          dashscope_api_key   = ""
          minimax_api_key     = ""
          google_api_key      = ""
          google_maps_api_key = "${GOOGLE_MAPS}"

          nvidia_api_key   = "${NVIDIA_KEY}"
          nvidia_api_key_b = ""
          nvidia_api_key_c = ""
          nvidia_api_key_d = ""
          nvidia_api_key_e = ""
          nvidia_api_key_f = ""
          nvidia_api_key_g = ""
          nvidia_api_key_h = ""
          nvidia_api_key_i = ""
          nvidia_api_key_j = ""

          stripe_secret_key      = "${STRIPE_SECRET}"
          stripe_publishable_key = "${STRIPE_PUB}"
          stripe_webhook_secret  = ""

          slack_webhook_url  = "${SLACK_URL}"
          telegram_bot_token = "${TG_TOKEN}"
          telegram_chat_id   = "${TG_CHAT}"

          n8n_base_url    = "https://automation.aliyarsolutions.com"
          n8n_webhook_url = "https://automation.aliyarsolutions.com/webhook"

          evolution_api_key    = "jarvis-master-key"
          evolution_api_url    = "https://aliyarsolutions.com/evolution"
          evolution_public_url = "https://aliyarsolutions.com/evolution"

          apollo_api_key = ""

          backend_cpu           = 512
          backend_memory        = 1024
          backend_desired_count = 1
          TFVARS

          echo "tfvars written (secrets masked)."

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          if [ "$S3_BACKEND_READY" = "true" ]; then
            echo "Using S3 backend for state persistence"
            terraform init \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=production/terraform.tfstate" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="encrypt=true" \
              -backend-config="dynamodb_table=$TF_LOCK_TABLE"
          else
            echo "⚠️ S3 not available — overriding to local backend"
            cat > backend_override.tf <<'BACKEND_EOF'
terraform {
  backend "local" {
    path = "terraform.tfstate"
  }
}
BACKEND_EOF
            terraform init -reconfigure
          fi

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -no-color 2>&1 | tail -100

      - name: Terraform Apply
        if: github.event.inputs.action != 'plan-only' && github.event.inputs.action != 'destroy' && github.event_name != 'pull_request'
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve tfplan
          echo ""
          echo "=== TERRAFORM OUTPUTS ==="
          terraform output -no-color 2>/dev/null || true

      - name: Capture and display key outputs
        if: github.event.inputs.action != 'plan-only' && github.event.inputs.action != 'destroy' && github.event_name != 'pull_request'
        working-directory: infra/terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "not_available")
          ECR_BACKEND=$(terraform output -raw ecr_backend_url 2>/dev/null || echo "not_available")
          ECR_FRONTEND=$(terraform output -raw ecr_frontend_url 2>/dev/null || echo "not_available")
          ECS_CLUSTER=$(terraform output -raw ecs_cluster_name 2>/dev/null || echo "not_available")

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║          JARVIS ECS INFRASTRUCTURE READY                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  ALB DNS:       $ALB_DNS"
          echo "║  ECR Backend:   $ECR_BACKEND"
          echo "║  ECR Frontend:  $ECR_FRONTEND"
          echo "║  ECS Cluster:   $ECS_CLUSTER"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Next: Point aliyarsolutions.com CNAME → $ALB_DNS"
          echo "║  Then: Merge PR #1 to trigger ECS deploy                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Save terraform state to cache (fallback path)
        if: env.S3_BACKEND_READY != 'true'
        uses: actions/cache/save@v4
        with:
          path: infra/terraform/terraform.tfstate
          key: terraform-state-production-${{ github.run_id }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: infra/terraform
        run: |
          echo "WARNING: This will destroy ALL production infrastructure!"
          terraform destroy -auto-approve -var-file=terraform.tfvars
