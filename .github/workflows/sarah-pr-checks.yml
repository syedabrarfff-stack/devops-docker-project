name: Sarah — PR Checks

on:
  pull_request:
    paths:
      - "sarah-ai-receptionist/**"

env:
  WORKDIR: sarah-ai-receptionist

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio ruff bandit mypy pip-audit
      - name: Lint
        run: ruff check app
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Security scan (Bandit)
        run: bandit -r app -ll
      - name: Dependency vulnerability scan
        # Ignore-list explanation:
        # - PYSEC-2026-1325 (ecdsa Minerva side-channel): no upstream fix;
        #   ecdsa is used inside python-jose for JWT verification which we
        #   do server-side over TLS, so the timing surface isn't reachable.
        # - PYSEC-2026-{2263,3455,3456,3457} (pyasn1 DoS on crafted ASN.1):
        #   pyasn1<0.5 is hard-pinned by python-jose 3.4.0. Our JWT path
        #   parses JSON, not ASN.1, so untrusted ASN.1 never reaches pyasn1.
        # - PYSEC-2026-{161,248,249,1941,1942,2280,2281} (starlette):
        #   starlette version is constrained by fastapi 0.121.0. Not
        #   exploitable — we don't mount StaticFiles, and form-DoS is
        #   mitigated by ALB in front of the app.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-2263 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3457 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281
      - name: Unit tests
        run: pytest tests/ -v
        working-directory: ${{ env.WORKDIR }}

  container-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t sarah-backend:pr-check .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sarah-backend:pr-check
          format: table
          # CI blocks on CRITICAL only. HIGH findings are logged but
          # non-blocking: the remaining 9 HIGHs on this image are all
          # transitive deps (starlette pinned by fastapi's version bound,
          # plus pyasn1 / wheel / jaraco.context from the build toolchain)
          # and none are exploitable in this stack (StaticFiles unused;
          # form-DoS mitigated by ALB). Bumping fastapi + repinning
          # transitives is queued as a separate cleanup.
          severity: CRITICAL
          # Skip CVEs with no available fix (Debian bookworm OS packages
          # with unfixed advisories).
          ignore-unfixed: true
          exit-code: "1"

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
      - run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/infra/terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive ../../
