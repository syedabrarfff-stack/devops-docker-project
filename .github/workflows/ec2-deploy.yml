name: JARVIS — EC2 Deploy (Full Stack) [OIDC active]

on:
  push:
    branches:
      - claude/jarvis-cans-api-integration-ZThTD
    paths:
      - 'infrastructure/nginx/**'
      - 'infrastructure/docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/ec2-deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Deploy action
        required: false
        default: full-restart
        type: choice
        options:
          - full-restart
          - backend-only
          - frontend-only
          - nginx-reload
          - git-pull-only
          - verify-status

env:
  EC2_HOST: aliyarsolutions.com
  BRANCH: claude/jarvis-cans-api-integration-ZThTD
  AWS_ACCOUNT_ID: "824232273953"
  # Node.js 24 compat: remove when aws-actions releases Node.js 24 builds
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # OIDC permissions — allows GitHub to authenticate with AWS without stored secrets
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials (OIDC — no secrets needed)
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::824232273953:role/JarvisGitHubActionsRole
          role-session-name: JarvisGitHubDeploy
          aws-region: ap-south-2

      # ── SSM path (uses AWS credentials) ───────────────────────────────────
      - name: Deploy via SSM
        id: ssm
        if: steps.aws_creds.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          ACTION="${ACTION:-full-restart}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ap-south-2 \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text 2>/dev/null | tr '\t' '\n' | head -1)

          echo "EC2 Instance: $INSTANCE_ID"
          [ -z "$INSTANCE_ID" ] && { echo "No running instance"; exit 1; }

          # ── Write the deploy script with single-quote heredoc (no expansion) ──
          # __GHTOKEN__ is replaced by sed below before base64 encoding.
          cat > /tmp/jarvis-deploy.sh << 'DEPLOY_SCRIPT_EOF'
#!/bin/bash
set -e
ACTION="${1:-full-restart}"
GH_TOKEN="__GHTOKEN__"

# ── Locate deploy directory ───────────────────────────────────────────────
DEPLOY_DIR=/opt/jarvis
if [ ! -f /opt/jarvis/infrastructure/docker-compose.yml ]; then
  DEPLOY_DIR=/home/ubuntu/devops-docker-project
fi

# ── First-install: clone repo if docker-compose.yml is missing ───────────
if [ ! -f "$DEPLOY_DIR/infrastructure/docker-compose.yml" ]; then
  apt-get install -y git curl 2>/dev/null || true
  git clone "https://x-access-token:${GH_TOKEN}@github.com/syedabrarfff-stack/devops-docker-project.git" /opt/jarvis 2>&1 | tail -5
  DEPLOY_DIR=/opt/jarvis
fi

echo "=== DEPLOY DIR: $DEPLOY_DIR ==="
cd "$DEPLOY_DIR"

# ── Install docker-compose if missing ────────────────────────────────────
which docker-compose 2>/dev/null || {
  curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 \
    -o /usr/local/bin/docker-compose
  chmod +x /usr/local/bin/docker-compose
}

# ── Configure git credentials (ephemeral — cleaned up at end) ────────────
git config --global credential.helper store
printf 'https://x-access-token:%s@github.com\n' "${GH_TOKEN}" > /root/.git-credentials
chmod 600 /root/.git-credentials
echo "Git credentials configured"

# ── Fetch + pull latest code ─────────────────────────────────────────────
GIT_FETCH_OK=false
for i in 1 2 3 4 5; do
  git fetch origin claude/jarvis-cans-api-integration-ZThTD 2>&1 && { GIT_FETCH_OK=true; break; } || { echo "git fetch attempt $i/5 failed"; sleep 20; }
done
if [ "$GIT_FETCH_OK" != "true" ]; then
  echo "ERROR: All git fetch attempts failed — aborting"
  exit 1
fi

git checkout claude/jarvis-cans-api-integration-ZThTD 2>/dev/null || true
git clean -f -- public-site/ 2>/dev/null || true

for i in 1 2 3 4 5; do
  git pull origin claude/jarvis-cans-api-integration-ZThTD 2>&1 && break || { echo "git pull attempt $i/5 failed"; sleep 20; }
done
echo "=== LATEST: $(git log --oneline -1) ==="

# ── Ensure .env exists ───────────────────────────────────────────────────
if [ ! -f "$DEPLOY_DIR/.env" ]; then
  cp "$DEPLOY_DIR/.env.example" "$DEPLOY_DIR/.env"
  echo "Created .env from .env.example"
fi

# ── Fix placeholder passwords so docker-compose can start ────────────────
# The :? operator in docker-compose.yml causes a hard failure if these are unset.
if grep -qE "REPLACE_WITH_STRONG_DB_PASSWORD|REPLACE_WITH_STRONG_REDIS_PASSWORD|change-this-to-a-long-random-secret-key" "$DEPLOY_DIR/.env" 2>/dev/null; then
  echo "=== Generating random passwords to replace placeholders ==="
  DB_PASS=$(openssl rand -hex 32)
  REDIS_PASS=$(openssl rand -hex 24)
  SECRET_KEY=$(openssl rand -hex 64)
  sed -i "s|REPLACE_WITH_STRONG_DB_PASSWORD|${DB_PASS}|g"         "$DEPLOY_DIR/.env"
  sed -i "s|REPLACE_WITH_STRONG_REDIS_PASSWORD|${REDIS_PASS}|g"   "$DEPLOY_DIR/.env"
  sed -i "s|change-this-to-a-long-random-secret-key|${SECRET_KEY}|g" "$DEPLOY_DIR/.env"
  sed -i "s|change-this-to-a-strong-password|JarvisAdmin2025!|g"  "$DEPLOY_DIR/.env"
  echo "=== Passwords generated and saved to .env ==="
fi

mkdir -p "$DEPLOY_DIR/jarvis-data/daily" "$DEPLOY_DIR/jarvis-data/outputs"

# ── Execute the requested action ─────────────────────────────────────────
case "$ACTION" in

  nginx-reload)
    cd "$DEPLOY_DIR/infrastructure"
    docker-compose -p jarvis exec -T nginx nginx -s reload 2>/dev/null || docker-compose -p jarvis restart nginx
    curl -sf http://localhost/health && echo HEALTH_OK || echo HEALTH_FAIL
    ;;

  git-pull-only)
    echo "=== GIT PULL COMPLETE ==="
    git log --oneline -3
    ;;

  frontend-only)
    cd "$DEPLOY_DIR/infrastructure"
    docker-compose -p jarvis build --no-cache frontend > /tmp/frontend_build.log 2>&1 && echo FRONTEND_BUILD_OK || echo FRONTEND_BUILD_FAILED
    tail -15 /tmp/frontend_build.log
    docker-compose -p jarvis up -d --no-deps frontend 2>&1 | tail -3
    sleep 5
    curl -sf http://localhost/health && echo NGINX_PROXY_OK || echo NGINX_PROXY_FAIL
    docker-compose -p jarvis ps frontend
    ;;

  backend-only)
    cd "$DEPLOY_DIR/infrastructure"
    docker stop jarvis_backend 2>/dev/null || true
    docker rm jarvis_backend 2>/dev/null || true
    fuser -k 8000/tcp 2>/dev/null || true
    lsof -ti:8000 2>/dev/null | xargs -r kill -9 2>/dev/null || true
    sleep 2
    docker-compose -p jarvis up -d --no-deps --build backend 2>&1 | tail -5
    sleep 20
    docker-compose -p jarvis exec -T backend alembic upgrade head 2>&1 | tail -10 || echo MIGRATION_ATTEMPTED
    sleep 5
    curl -sf http://localhost:8000/health && echo BACKEND_HEALTHY || echo BACKEND_FAIL
    docker-compose -p jarvis ps
    ;;

  verify-status)
    docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
    curl -sf http://localhost/health && echo NGINX_PROXY_OK || echo NGINX_PROXY_FAIL
    curl -sf http://localhost:8000/health && echo BACKEND_OK || echo BACKEND_DOWN
    docker exec jarvis_backend alembic current 2>/dev/null || true
    ;;

  *)
    # full-restart
    cd "$DEPLOY_DIR/infrastructure"

    echo "=== CLEARING STALE CONTAINERS ==="
    docker stop jarvis_backend jarvis_nginx 2>/dev/null || true
    docker rm jarvis_backend jarvis_nginx 2>/dev/null || true
    docker ps -q --filter publish=8000 | xargs -r docker stop 2>/dev/null || true
    docker ps -aq --filter publish=8000 | xargs -r docker rm 2>/dev/null || true

    echo "=== STARTING DEPS (postgres + redis) ==="
    docker-compose -p jarvis up -d postgres redis 2>&1 | tail -3
    sleep 15

    echo "=== CLEARING PYCACHE ==="
    find "$DEPLOY_DIR/backend" -type d -name __pycache__ | xargs -r rm -rf 2>/dev/null || true
    find "$DEPLOY_DIR/backend" -name '*.pyc' | xargs -r rm -f 2>/dev/null || true

    echo "=== REBUILDING BACKEND ==="
    if docker-compose -p jarvis build --no-cache backend > /tmp/build.log 2>&1; then
      echo BUILD_OK
      tail -30 /tmp/build.log
    else
      echo BUILD_FAILED
      tail -30 /tmp/build.log
      exit 1
    fi

    echo "=== RELEASING PORT 8000 ==="
    fuser -k 8000/tcp 2>/dev/null || true
    lsof -ti:8000 2>/dev/null | xargs -r kill -9 2>/dev/null || true
    sleep 3

    docker-compose -p jarvis up -d --no-deps backend 2>&1 | tail -3

    echo "=== REBUILDING NGINX ==="
    docker-compose -p jarvis up -d --no-deps --build nginx 2>&1 | tail -3

    echo "=== REBUILDING FRONTEND ==="
    docker-compose -p jarvis build --no-cache frontend > /tmp/frontend_build.log 2>&1 && echo FRONTEND_BUILD_OK || echo FRONTEND_BUILD_WARN
    tail -10 /tmp/frontend_build.log
    docker-compose -p jarvis up -d --no-deps frontend 2>&1 | tail -3

    echo "=== WAITING FOR BACKEND STARTUP (45s) ==="
    sleep 45

    echo "=== BACKEND CONTAINER STATUS ==="
    docker inspect jarvis_backend --format='{{.State.Status}}' 2>/dev/null || echo no_container

    echo "=== RUNNING ALEMBIC MIGRATIONS ==="
    docker-compose -p jarvis exec -T backend alembic upgrade head 2>&1 | tail -10 \
      || docker exec jarvis_backend alembic upgrade head 2>&1 | tail -10 \
      || echo MIGRATION_ATTEMPTED

    sleep 5

    echo "=== HEALTH CHECKS ==="
    curl -sf http://localhost/health && echo NGINX_PROXY_HEALTH_OK || echo NGINX_PROXY_HEALTH_FAIL
    curl -sf http://localhost:8000/health && echo BACKEND_HEALTH_OK || echo BACKEND_HEALTH_FAIL

    echo "=== BACKEND LOGS TAIL ==="
    docker logs jarvis_backend --tail=30 2>&1 | tail -30

    echo "=== TRIGGERING PIPELINE ==="
    curl -sf -X POST "http://localhost:8000/api/v1/leads/bulk-discover?limit=200" && echo BULK_DISCOVER_TRIGGERED || echo BULK_DISCOVER_FAIL
    curl -sf -X POST "http://localhost:8000/api/v1/crm/hubspot-sync" && echo HUBSPOT_SYNC_TRIGGERED || echo HUBSPOT_SYNC_FAIL

    WA=$(curl -sf http://localhost:8080/instance/connectionState/jarvis-main -H apikey:jarvis-master-key 2>/dev/null || echo "{}")
    echo "WhatsApp state: $WA"

    echo "=== DOCKER STATUS ==="
    docker-compose -p jarvis ps

    echo "=== DEPLOY_COMPLETE ==="
    ;;
esac

# Clean up ephemeral git credentials
rm -f /root/.git-credentials
DEPLOY_SCRIPT_EOF

          # Inject GitHub token (alphanumeric+_ only — safe for sed with | delimiter)
          sed -i "s|__GHTOKEN__|${GH_TOKEN}|g" /tmp/jarvis-deploy.sh

          # Base64-encode the script (output is [A-Za-z0-9+/=] — JSON-safe, no single quotes)
          SCRIPT_B64=$(base64 -w0 /tmp/jarvis-deploy.sh)

          CMD_ID=$(aws ssm send-command \
            --region ap-south-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --parameters "{\"commands\": [\"echo '${SCRIPT_B64}' | base64 -d | bash -s '${ACTION}'\"]}" \
            --comment "JARVIS ${ACTION} deploy" \
            --query "Command.CommandId" \
            --output text 2>/dev/null)

          [ -z "$CMD_ID" ] && { echo "SSM send-command failed"; exit 1; }
          echo "SSM Command ID: $CMD_ID"

          # Poll up to 14 min — Docker build takes 8-12 min on EC2
          sleep 60
          for attempt in $(seq 1 25); do
            RESULT=$(aws ssm get-command-invocation \
              --region ap-south-2 \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || echo '{"Status":"Pending"}')
            STATUS=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Status","Pending"))' 2>/dev/null)
            [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] && break
            echo "Attempt $attempt/25: $STATUS — waiting 30s..."
            sleep 30
          done

          echo "=== SSM Result: $STATUS ==="
          OUTPUT=$(echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("StandardOutputContent",""))' 2>/dev/null)
          echo "$OUTPUT"
          STDERR=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StandardErrorContent",""))' 2>/dev/null)
          [ -n "$STDERR" ] && echo "STDERR: $STDERR"

          if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
            BACKEND_UP=$(echo "$OUTPUT" | grep -c "BACKEND_HEALTH_OK" || true)
            BUILD_FAILED=$(echo "$OUTPUT" | grep -c "BUILD_FAILED" || true)
            if [ "$BACKEND_UP" -gt 0 ]; then
              echo "=== DEPLOY SUCCEEDED — backend is UP ==="
              exit 0
            elif [ "$BUILD_FAILED" -gt 0 ]; then
              echo "=== BUILD FAILED — check output above for Docker build errors ==="
              exit 1
            elif [ "$STATUS" = "Success" ]; then
              echo "=== SSM succeeded but backend health unknown ==="
              echo "$OUTPUT" | grep -E "HEALTH_OK|HEALTH_FAIL|READYZ|BUILD_|DEPLOY_COMPLETE" || true
              exit 1
            else
              echo "=== SSM FAILED — check output above ==="
              exit 1
            fi
          elif [ "$STATUS" = "InProgress" ]; then
            echo "=== SSM STILL RUNNING — Docker build >13 min (normal). Checking status... ==="
            sleep 90
            STATUS_CMDS='["curl -sf http://localhost:8000/health && echo BACKEND_OK || echo BACKEND_FAIL","curl -sf http://localhost/health && echo NGINX_OK || echo NGINX_FAIL","docker logs jarvis_backend --tail=20 2>&1 || true"]'
            STATUS_CMD=$(aws ssm send-command \
              --region ap-south-2 \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 120 \
              --parameters "{\"commands\": $STATUS_CMDS}" \
              --comment "JARVIS status check" \
              --query "Command.CommandId" \
              --output text 2>/dev/null || echo "")
            if [ -n "$STATUS_CMD" ]; then
              sleep 35
              STATUS_RESULT=$(aws ssm get-command-invocation \
                --region ap-south-2 \
                --command-id "$STATUS_CMD" \
                --instance-id "$INSTANCE_ID" \
                --output json 2>/dev/null || echo '{"Status":"Pending","StandardOutputContent":""}')
              echo "=== STATUS CHECK OUTPUT ==="
              echo "$STATUS_RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("StandardOutputContent",""))' 2>/dev/null
              BACKEND_OK=$(echo "$STATUS_RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if "BACKEND_OK" in d.get("StandardOutputContent","") else "no")' 2>/dev/null)
              [ "$BACKEND_OK" = "yes" ] && exit 0 || exit 1
            fi
            exit 1
          else
            echo "=== SSM FAILED with status: $STATUS ==="
            exit 1
          fi

      # ── SSH path (fallback when AWS creds missing) ─────────────────────────
      - name: Deploy via SSH (fallback)
        id: ssh_deploy
        if: steps.aws_creds.outcome != 'success' || steps.ssm.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 10m
          script: |
            set -e
            DEPLOY_DIR=/opt/jarvis
            [ -f /opt/jarvis/infrastructure/docker-compose.yml ] || DEPLOY_DIR=/home/ubuntu/devops-docker-project

            echo "=== DEPLOY DIR: $DEPLOY_DIR ==="
            cd $DEPLOY_DIR

            for i in 1 2 3 4 5; do
              git fetch origin claude/jarvis-cans-api-integration-ZThTD 2>&1 && break || { echo "git fetch attempt $i/5 failed"; sleep 15; }
            done
            git checkout claude/jarvis-cans-api-integration-ZThTD 2>/dev/null || true
            git clean -f -- public-site/ 2>/dev/null || true
            for i in 1 2 3 4 5; do
              git pull origin claude/jarvis-cans-api-integration-ZThTD 2>&1 && break || { echo "git pull attempt $i/5 failed"; sleep 15; }
            done
            echo "=== LATEST: $(git log --oneline -1) ==="

            cd $DEPLOY_DIR/infrastructure

            ACTION="${{ github.event.inputs.action }}"
            ACTION="${ACTION:-full-restart}"

            if [ "$ACTION" = "nginx-reload" ]; then
              docker-compose exec -T nginx nginx -s reload || docker-compose restart nginx
              curl -sf http://localhost/health && echo "NGINX OK" || echo "NGINX FAIL"

            elif [ "$ACTION" = "verify-status" ]; then
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              curl -sf http://localhost:8000/health && echo "BACKEND OK" || echo "BACKEND DOWN"

            else
              echo "=== REBUILDING BACKEND ==="
              docker-compose up -d --no-deps --build backend 2>&1 | tail -10

              echo "=== REBUILDING NGINX ==="
              docker-compose up -d --no-deps --build nginx 2>&1 | tail -5

              echo "=== REBUILDING FRONTEND ==="
              docker-compose up -d --no-deps --build frontend 2>&1 | tail -5

              sleep 25

              echo "=== RUNNING MIGRATIONS ==="
              docker-compose exec -T backend alembic upgrade head 2>&1 || \
                docker exec jarvis_backend alembic upgrade head 2>&1 || \
                echo "MIGRATION_ATTEMPTED"

              sleep 5

              curl -sf http://localhost/health && echo "NGINX_PROXY: OK" || echo "NGINX_PROXY: FAIL"
              curl -sf http://localhost:8000/health && echo "BACKEND: OK" || echo "BACKEND: FAIL"

              echo "=== DEPLOY COMPLETE ==="
            fi

      # ── Final status report ────────────────────────────────────────────────
      - name: Status Report
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║         JARVIS DEPLOY STATUS REPORT              ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  AWS SSM:  ${{ steps.ssm.outcome }}"
          echo "║  SSH:      ${{ steps.ssh_deploy.outcome }}"
          echo "╠══════════════════════════════════════════════════╣"

          HEALTH=$(curl -so /dev/null -w "%{http_code}" --connect-timeout 5 https://aliyarsolutions.com/health 2>/dev/null || echo "000")
          EVOL=$(curl -so /dev/null -w "%{http_code}" --connect-timeout 5 https://aliyarsolutions.com/evolution/ 2>/dev/null || echo "000")
          GRAFANA=$(curl -so /dev/null -w "%{http_code}" --connect-timeout 5 https://aliyarsolutions.com/grafana/ 2>/dev/null || echo "000")

          echo "║  /health:    HTTP $HEALTH  (200=OK  502=backend down  000=nginx down)"
          echo "║  /evolution: HTTP $EVOL   (200=OK)"
          echo "║  /grafana:   HTTP $GRAFANA   (401=running)"

          WA_STATE=$(curl -sf --connect-timeout 5 \
            "https://aliyarsolutions.com/evolution/instance/connectionState/jarvis-main" \
            -H "apikey: jarvis-master-key" 2>/dev/null | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('instance',{}).get('state','unknown'))" 2>/dev/null || echo "unknown")
          echo "║  WhatsApp:   $WA_STATE"
          echo "╠══════════════════════════════════════════════════╣"

          if [ "$HEALTH" = "200" ]; then
            echo "║  ✅ BACKEND IS UP AND HEALTHY"
          else
            echo "║  ❌ BACKEND DOWN (HTTP $HEALTH)"
            echo "║"
            echo "║  To enable SSH fallback, add GitHub secret EC2_SSH_KEY:"
            echo "║  github.com/syedabrarfff-stack/devops-docker-project"
            echo "║  → Settings → Secrets → Actions → New repository secret"
            echo "║  Name: EC2_SSH_KEY"
            echo "║  Value: contents of your EC2 private key (.pem)"
          fi
          echo "╚══════════════════════════════════════════════════╝"
