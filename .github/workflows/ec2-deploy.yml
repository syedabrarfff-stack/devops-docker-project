name: JARVIS — EC2 Deploy (Nginx + Backend)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy action
        required: true
        default: nginx-reload
        type: choice
        options:
          - nginx-reload
          - full-restart
          - git-pull-only
      ec2_host:
        description: EC2 host (default aliyarsolutions.com)
        required: false
        default: aliyarsolutions.com

env:
  EC2_HOST: ${{ github.event.inputs.ec2_host || 'aliyarsolutions.com' }}
  DEPLOY_DIR_PRIMARY: /home/ubuntu/devops-docker-project
  DEPLOY_DIR_ALT: /opt/jarvis
  BRANCH: claude/jarvis-cans-api-integration-ZThTD

jobs:
  deploy-via-ssm:
    name: Deploy via AWS SSM (no SSH key required)
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      ssm_success: ${{ steps.ssm.outputs.success }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Find EC2 instance
        id: find_ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ap-south-2 \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text 2>/dev/null | tr '\t' '\n' | head -1)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found EC2 instance: $INSTANCE_ID"

      - name: Send SSM deploy command
        id: ssm
        if: steps.find_ec2.outputs.instance_id != ''
        run: |
          INSTANCE_ID="${{ steps.find_ec2.outputs.instance_id }}"
          ACTION="${{ github.event.inputs.action }}"

          if [ "$ACTION" = "nginx-reload" ]; then
            COMMANDS='["set -e",
              "DEPLOY_DIR=/home/ubuntu/devops-docker-project",
              "[ -d /opt/jarvis ] && DEPLOY_DIR=/opt/jarvis || true",
              "cd $DEPLOY_DIR",
              "git fetch origin claude/jarvis-cans-api-integration-ZThTD",
              "git checkout claude/jarvis-cans-api-integration-ZThTD",
              "git pull origin claude/jarvis-cans-api-integration-ZThTD",
              "cd infrastructure",
              "docker compose exec -T nginx nginx -s reload || docker compose restart nginx",
              "echo DONE: nginx reloaded with latest config",
              "curl -sf http://localhost/health && echo HEALTH OK"
            ]'
          elif [ "$ACTION" = "full-restart" ]; then
            COMMANDS='["set -e",
              "DEPLOY_DIR=/home/ubuntu/devops-docker-project",
              "[ -d /opt/jarvis ] && DEPLOY_DIR=/opt/jarvis || true",
              "cd $DEPLOY_DIR",
              "git fetch origin claude/jarvis-cans-api-integration-ZThTD",
              "git checkout claude/jarvis-cans-api-integration-ZThTD",
              "git pull origin claude/jarvis-cans-api-integration-ZThTD",
              "cd infrastructure",
              "docker compose up -d --build nginx backend",
              "sleep 20",
              "curl -sf http://localhost/health && echo HEALTH OK",
              "curl -sf http://localhost/evolution/health && echo EVOLUTION OK"
            ]'
          else
            COMMANDS='["set -e",
              "DEPLOY_DIR=/home/ubuntu/devops-docker-project",
              "[ -d /opt/jarvis ] && DEPLOY_DIR=/opt/jarvis || true",
              "cd $DEPLOY_DIR",
              "git fetch origin claude/jarvis-cans-api-integration-ZThTD",
              "git checkout claude/jarvis-cans-api-integration-ZThTD",
              "git pull origin claude/jarvis-cans-api-integration-ZThTD",
              "echo DONE: git pull complete",
              "git log --oneline -3"
            ]'
          fi

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $COMMANDS}" \
            --query "Command.CommandId" \
            --output text 2>/dev/null)

          if [ -z "$COMMAND_ID" ]; then
            echo "SSM command failed — instance may not have SSM agent"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SSM Command ID: $COMMAND_ID"
          sleep 15

          OUTPUT=$(aws ssm get-command-invocation \
            --region ap-south-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json 2>/dev/null || echo '{"Status":"Failed"}')

          STATUS=$(echo "$OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('Status','Unknown'))")
          STDOUT=$(echo "$OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('StandardOutputContent',''))" 2>/dev/null)

          echo "SSM Status: $STATUS"
          echo "$STDOUT"

          if [ "$STATUS" = "Success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

  deploy-via-ssh:
    name: Deploy via SSH key
    runs-on: ubuntu-latest
    needs: deploy-via-ssm
    if: needs.deploy-via-ssm.outputs.ssm_success != 'true' && secrets.EC2_SSH_KEY != ''

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e
            DEPLOY_DIR=/home/ubuntu/devops-docker-project
            [ -d /opt/jarvis ] && DEPLOY_DIR=/opt/jarvis || true
            cd $DEPLOY_DIR
            git fetch origin claude/jarvis-cans-api-integration-ZThTD
            git checkout claude/jarvis-cans-api-integration-ZThTD
            git pull origin claude/jarvis-cans-api-integration-ZThTD
            cd infrastructure
            ACTION="${{ github.event.inputs.action }}"
            if [ "$ACTION" = "full-restart" ]; then
              docker compose up -d --build nginx backend
              sleep 20
            else
              docker compose exec -T nginx nginx -s reload || docker compose restart nginx
            fi
            curl -sf http://localhost/health && echo "HEALTH OK"
            echo "DEPLOY COMPLETE"

  report:
    name: Report status
    runs-on: ubuntu-latest
    needs: [deploy-via-ssm, deploy-via-ssh]
    if: always()

    steps:
      - name: Post to Slack
        if: secrets.SLACK_WEBHOOK_URL != ''
        run: |
          if [ "${{ needs.deploy-via-ssm.outputs.ssm_success }}" = "true" ]; then
            MSG="✅ *EC2 nginx reloaded via SSM* — JARVIS transport fix deployed. Evolution API + webhooks now active."
          else
            MSG="⚠️ *EC2 deploy via SSM failed* — SSH fallback attempted. Check Actions logs. Manual deploy may be needed."
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$MSG\"}" || true

      - name: Manual deploy instructions
        if: needs.deploy-via-ssm.outputs.ssm_success != 'true'
        run: |
          echo "============================================"
          echo "AUTOMATED DEPLOY FAILED — MANUAL STEPS:"
          echo "============================================"
          echo ""
          echo "SSH into EC2 and run:"
          echo ""
          echo "  DEPLOY_DIR=\$([ -d /opt/jarvis ] && echo /opt/jarvis || echo /home/ubuntu/devops-docker-project)"
          echo "  cd \$DEPLOY_DIR"
          echo "  git pull origin claude/jarvis-cans-api-integration-ZThTD"
          echo "  cd infrastructure"
          echo "  docker compose exec nginx nginx -s reload"
          echo ""
          echo "Then verify:"
          echo "  curl https://aliyarsolutions.com/evolution/health"
          echo "============================================"
