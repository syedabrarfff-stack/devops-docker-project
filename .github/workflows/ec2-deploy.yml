name: JARVIS — EC2 Deploy (Full Stack) [OIDC active]

# NOTE: the automatic `push` trigger that used to live here was removed on
# 2026-07-10. It silently ran a destructive `full-restart` (stop+remove
# backend/nginx, rebuild, restart) on every commit to scripts/**, backend/**,
# frontend/**, or this file — with no review step and no way to opt out.
# That is what took production down mid-incident while fixing an unrelated
# login bug. Deploys to production now happen ONLY via an explicit,
# manually-triggered "Run workflow" (workflow_dispatch below).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy action — GitHub pre-fills this dropdown with the default below; you must click it and actively pick the action you want, or it silently reruns the default'
        required: true
        default: verify-status
        type: choice
        options:
          - full-restart
          - backend-only
          - frontend-only
          - nginx-reload
          - git-pull-only
          - verify-status
          - set-captain-credentials
          - production-audit
      captain_username:
        description: 'New captain username (only used for set-captain-credentials — masked in logs via ::add-mask::)'
        required: false
        type: string
      captain_password:
        description: 'New captain password (only used for set-captain-credentials — masked in logs via ::add-mask::)'
        required: false
        type: string

env:
  EC2_HOST: aliyarsolutions.com
  BRANCH: claude/jarvis-cans-api-integration-ZThTD
  AWS_ACCOUNT_ID: "824232273953"
  # Node.js 24 compat: remove when aws-actions releases Node.js 24 builds
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # OIDC permissions — allows GitHub to authenticate with AWS without stored secrets
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no secrets needed)
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::824232273953:role/JarvisGitHubActionsRole
          role-session-name: JarvisGitHubDeploy
          aws-region: ap-south-2

      # ── Mask captain-credential inputs BEFORE any step's env: block references them
      # workflow_dispatch inputs of type: string are NOT auto-masked by GitHub Actions.
      # The previous approach put ${{ github.event.inputs.captain_password }} in the
      # SSM step's env: block and called ::add-mask:: inside the run script, but the
      # env: block is displayed VERBATIM before the run script executes — that's how
      # the previous captain password leaked in plaintext into the run log.
      # This step reads the inputs from $GITHUB_EVENT_PATH via jq (which never
      # interpolates them into the rendered run script), registers the masks, then
      # publishes them via $GITHUB_ENV so every subsequent step's env: block renders
      # them as *** at display time.
      - name: Register captain-credential masks
        if: github.event.inputs.action == 'set-captain-credentials'
        run: |
          CAPTAIN_USER=$(jq -r '.inputs.captain_username // ""' "$GITHUB_EVENT_PATH")
          CAPTAIN_PASS=$(jq -r '.inputs.captain_password // ""' "$GITHUB_EVENT_PATH")
          if [ -z "$CAPTAIN_USER" ] || [ -z "$CAPTAIN_PASS" ]; then
            echo "::error::set-captain-credentials requires both captain_username and captain_password inputs"
            exit 1
          fi
          echo "::add-mask::$CAPTAIN_USER"
          echo "::add-mask::$CAPTAIN_PASS"
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "CAPTAIN_USER<<$DELIM"
            echo "$CAPTAIN_USER"
            echo "$DELIM"
            echo "CAPTAIN_PASS<<$DELIM"
            echo "$CAPTAIN_PASS"
            echo "$DELIM"
          } >> "$GITHUB_ENV"
          echo "Captain credential inputs registered and masked"

      # ── SSM path (uses AWS credentials) ─────────────────────────────────────
      - name: Deploy via SSM
        id: ssm
        if: steps.aws_creds.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CAPTAIN_USER and CAPTAIN_PASS are inherited from $GITHUB_ENV (set by
          # the "Register captain-credential masks" step above). Because the mask
          # was registered before this step began, any log rendering of these
          # values in this step's env block appears as ***.
        run: |
          ACTION="${{ github.event.inputs.action }}"
          ACTION="${ACTION:-full-restart}"

          # Pinned to the verified production instance — there is a second, unrelated
          # "running" instance (i-00381dfb44fd3cf45, Jarvis-Terraform-Server) in this
          # account that a "first running instance" query used to pick up instead,
          # silently deploying to the wrong box. Verified via:
          #   python3 -c "import socket; print(socket.gethostbyname('aliyarsolutions.com'))"
          #   → 16.112.184.189 → i-07887c05a28c22675 ("jarvis-work-dr-recovery")
          # If this instance is ever replaced (e.g. Phase 8 resize), update this ID.
          INSTANCE_ID="i-07887c05a28c22675"

          ACTUAL_STATE=$(aws ec2 describe-instances \
            --region ap-south-2 \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[].Instances[].State.Name" \
            --output text 2>/dev/null)

          echo "EC2 Instance: $INSTANCE_ID (state: $ACTUAL_STATE)"
          [ "$ACTUAL_STATE" != "running" ] && { echo "Pinned instance $INSTANCE_ID is not running (state: $ACTUAL_STATE) — refusing to deploy blind to another instance"; exit 1; }

          # Inject GitHub token into the deploy script then base64-encode it.
          # The script file lives in the repo — no YAML heredoc issues.
          # base64 alphabet is [A-Za-z0-9+/=] — JSON-safe, no single-quote chars.
          sed "s|__GHTOKEN__|${GH_TOKEN}|g" scripts/ec2-deploy-script.sh > /tmp/inject.sh
          SCRIPT_B64=$(base64 -w0 /tmp/inject.sh)

          # Credentials (only used for set-captain-credentials) travel base64-encoded
          # inside the SSM command too, so they never appear in plaintext in logs or JSON.
          # CAPTAIN_USER / CAPTAIN_PASS come from $GITHUB_ENV (set + masked earlier).
          # Empty for every other action — base64 of empty is safe, unused downstream.
          CAPTAIN_USER_B64=$(printf '%s' "${CAPTAIN_USER:-}" | base64 -w0)
          CAPTAIN_PASS_B64=$(printf '%s' "${CAPTAIN_PASS:-}" | base64 -w0)
          # Defensive: even the base64 form should never appear in logs if the
          # plaintext was masked. Registering masks on the encoded values covers
          # any code path that logs the SSM parameters JSON verbatim.
          [ -n "$CAPTAIN_USER_B64" ] && echo "::add-mask::$CAPTAIN_USER_B64"
          [ -n "$CAPTAIN_PASS_B64" ] && echo "::add-mask::$CAPTAIN_PASS_B64"

          # Single SSM command: export decoded credential overrides, then decode and run the script with ACTION as $1
          CMD_ID=$(aws ssm send-command \
            --region ap-south-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --parameters "{\"commands\": [\"export CAPTAIN_USERNAME_OVERRIDE=\$(echo ${CAPTAIN_USER_B64} | base64 -d); export CAPTAIN_PASSWORD_OVERRIDE=\$(echo ${CAPTAIN_PASS_B64} | base64 -d); echo '${SCRIPT_B64}' | base64 -d | bash -s '${ACTION}'\"]}" \
            --comment "JARVIS ${ACTION} deploy" \
            --query "Command.CommandId" \
            --output text 2>/dev/null)

          [ -z "$CMD_ID" ] && { echo "SSM send-command failed"; exit 1; }
          echo "SSM Command ID: $CMD_ID"

          # Poll up to 14 min — Docker build takes 8-12 min on EC2
          sleep 60
          for attempt in $(seq 1 25); do
            RESULT=$(aws ssm get-command-invocation \
              --region ap-south-2 \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || echo '{"Status":"Pending"}')
            STATUS=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Status","Pending"))' 2>/dev/null)
            [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] && break
            echo "Attempt $attempt/25: $STATUS — waiting 30s..."
            sleep 30
          done

          echo "=== SSM Result: $STATUS ==="
          OUTPUT=$(echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("StandardOutputContent",""))' 2>/dev/null)
          echo "$OUTPUT"
          STDERR=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StandardErrorContent",""))' 2>/dev/null)
          [ -n "$STDERR" ] && echo "STDERR: $STDERR"

          if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
            AUDIT_OK=$(echo "$OUTPUT" | grep -c "AUDIT_COMPLETE" || true)
            if [ "$AUDIT_OK" -gt 0 ]; then
              echo "=== PRODUCTION AUDIT COMPLETE — diagnostic output above ==="
              exit 0
            fi
            BACKEND_UP=$(echo "$OUTPUT" | grep -c "BACKEND_HEALTH_OK" || true)
            # /health is shallow (no DB check) — /readyz actually verifies DB
            # connectivity. Requiring both means a backend that's "up" but
            # can't reach Postgres no longer counts as a successful deploy.
            BACKEND_READY=$(echo "$OUTPUT" | grep -c "BACKEND_READYZ_OK" || true)
            BUILD_FAILED=$(echo "$OUTPUT" | grep -c "BUILD_FAILED" || true)
            if [ "$BACKEND_UP" -gt 0 ] && [ "$BACKEND_READY" -gt 0 ]; then
              echo "=== DEPLOY SUCCEEDED — backend is UP and ready (DB reachable) ==="
              exit 0
            elif [ "$BUILD_FAILED" -gt 0 ]; then
              echo "=== BUILD FAILED — check output above for Docker build errors ==="
              exit 1
            elif [ "$BACKEND_UP" -gt 0 ] && [ "$BACKEND_READY" -eq 0 ]; then
              echo "=== DEPLOY FAILED — backend responds to /health but /readyz failed (DB/dependency unreachable) ==="
              exit 1
            elif [ "$STATUS" = "Success" ]; then
              echo "=== SSM succeeded but backend health unknown ==="
              echo "$OUTPUT" | grep -E "HEALTH_OK|HEALTH_FAIL|READYZ_OK|READYZ_FAIL|BUILD_|DEPLOY_COMPLETE" || true
              exit 1
            else
              echo "=== SSM FAILED — check output above ==="
              exit 1
            fi
          elif [ "$STATUS" = "InProgress" ]; then
            echo "=== SSM STILL RUNNING — Docker build >13 min on EC2 (normal). Checking status... ==="
            sleep 90
            STATUS_CMDS='["curl -sf http://localhost:8000/health && echo BACKEND_OK || echo BACKEND_FAIL","curl -sf http://localhost/health && echo NGINX_OK || echo NGINX_FAIL","docker logs jarvis_backend --tail=20 2>&1 || true"]'
            STATUS_CMD=$(aws ssm send-command \
              --region ap-south-2 \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 120 \
              --parameters "{\"commands\": $STATUS_CMDS}" \
              --comment "JARVIS status check" \
              --query "Command.CommandId" \
              --output text 2>/dev/null || echo "")
            if [ -n "$STATUS_CMD" ]; then
              sleep 35
              STATUS_RESULT=$(aws ssm get-command-invocation \
                --region ap-south-2 \
                --command-id "$STATUS_CMD" \
                --instance-id "$INSTANCE_ID" \
                --output json 2>/dev/null || echo '{"Status":"Pending","StandardOutputContent":""}')
              echo "=== STATUS CHECK OUTPUT ==="
              echo "$STATUS_RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("StandardOutputContent",""))' 2>/dev/null
              BACKEND_OK=$(echo "$STATUS_RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if "BACKEND_OK" in d.get("StandardOutputContent","") else "no")' 2>/dev/null)
              [ "$BACKEND_OK" = "yes" ] && exit 0 || exit 1
            fi
            exit 1
          else
            echo "=== SSM FAILED with status: $STATUS ==="
            exit 1
          fi

      # ── SSH path (fallback when AWS creds missing) ───────────────────────────
      - name: Deploy via SSH (fallback)
        id: ssh_deploy
        if: steps.aws_creds.outcome != 'success' || steps.ssm.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 10m
          script: |
            set -e
            DEPLOY_DIR=/opt/jarvis
            [ -f /opt/jarvis/infrastructure/docker-compose.yml ] || DEPLOY_DIR=/home/ubuntu/devops-docker-project
            echo "=== DEPLOY DIR: $DEPLOY_DIR ==="
            cd $DEPLOY_DIR

            for i in 1 2 3 4 5; do
              git fetch origin claude/jarvis-cans-api-integration-ZThTD 2>&1 \
                && break || { echo "git fetch attempt $i/5 failed"; sleep 15; }
            done
            git checkout claude/jarvis-cans-api-integration-ZThTD 2>/dev/null || true
            git clean -f -- public-site/ 2>/dev/null || true
            for i in 1 2 3 4 5; do
              git pull origin claude/jarvis-cans-api-integration-ZThTD 2>&1 \
                && break || { echo "git pull attempt $i/5 failed"; sleep 15; }
            done
            echo "=== LATEST: $(git log --oneline -1) ==="

            cd $DEPLOY_DIR/infrastructure

            ACTION="${{ github.event.inputs.action }}"
            ACTION="${ACTION:-full-restart}"

            if [ "$ACTION" = "nginx-reload" ]; then
              docker-compose exec -T nginx nginx -s reload || docker-compose restart nginx
              curl -sf http://localhost/health && echo "NGINX OK" || echo "NGINX FAIL"
            elif [ "$ACTION" = "verify-status" ]; then
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              curl -sf http://localhost:8000/health && echo "BACKEND OK" || echo "BACKEND DOWN"
            else
              docker-compose up -d --no-deps --build backend 2>&1 | tail -10
              docker-compose up -d --no-deps --build nginx 2>&1 | tail -5
              docker-compose up -d --no-deps --build frontend 2>&1 | tail -5
              sleep 25
              docker-compose exec -T backend alembic upgrade head 2>&1 || \
                docker exec jarvis_backend alembic upgrade head 2>&1 || \
                echo "MIGRATION_ATTEMPTED"
              sleep 5
              curl -sf http://localhost/health && echo "NGINX_PROXY: OK" || echo "NGINX_PROXY: FAIL"
              curl -sf http://localhost:8000/health && echo "BACKEND: OK" || echo "BACKEND: FAIL"
              echo "=== DEPLOY COMPLETE ==="
            fi

      # ── Final status report ──────────────────────────────────────────────────
      - name: Status Report
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║         JARVIS DEPLOY STATUS REPORT              ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  AWS SSM:  ${{ steps.ssm.outcome }}"
          echo "║  SSH:      ${{ steps.ssh_deploy.outcome }}"
          echo "╠══════════════════════════════════════════════════╣"

          HEALTH=$(curl -so /dev/null -w "%{http_code}" --connect-timeout 5 https://aliyarsolutions.com/health 2>/dev/null || echo "000")
          EVOL=$(curl -so /dev/null -w "%{http_code}" --connect-timeout 5 https://aliyarsolutions.com/evolution/ 2>/dev/null || echo "000")
          GRAFANA=$(curl -so /dev/null -w "%{http_code}" --connect-timeout 5 https://aliyarsolutions.com/grafana/ 2>/dev/null || echo "000")

          echo "║  /health:    HTTP $HEALTH  (200=OK  502=backend down  000=nginx down)"
          echo "║  /evolution: HTTP $EVOL"
          echo "║  /grafana:   HTTP $GRAFANA  (401=running)"

          WA_STATE=$(curl -sf --connect-timeout 5 \
            "https://aliyarsolutions.com/evolution/instance/connectionState/jarvis-main" \
            -H "apikey: jarvis-master-key" 2>/dev/null | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('instance',{}).get('state','unknown'))" 2>/dev/null || echo "unknown")
          echo "║  WhatsApp:   $WA_STATE"
          echo "╠══════════════════════════════════════════════════╣"

          if [ "$HEALTH" = "200" ]; then
            echo "║  ✅ BACKEND IS UP AND HEALTHY"
          else
            echo "║  ❌ BACKEND DOWN (HTTP $HEALTH)"
            echo "║  To enable SSH fallback, add GitHub secret EC2_SSH_KEY:"
            echo "║  (EC2 private key .pem file contents)"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          # Both "Deploy via SSM" and "Deploy via SSH" have continue-on-error:
          # true (so one failing lets the other be tried as a fallback), and
          # this step itself only printed a report so far — without an
          # explicit exit here, a run where SSM times out, SSH has no key
          # configured, AND the live health check confirms the backend is
          # down would still show green in the Actions UI. Make the run's
          # conclusion match reality: fail whenever /health isn't 200.
          if [ "$HEALTH" != "200" ]; then
            echo "::error::Backend health check failed (HTTP $HEALTH) — see report above."
            exit 1
          fi
