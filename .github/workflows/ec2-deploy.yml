name: JARVIS — EC2 Deploy (Nginx + Backend)

on:
  push:
    branches:
      - claude/jarvis-cans-api-integration-ZThTD
    paths:
      - 'infrastructure/nginx/**'
      - 'infrastructure/docker-compose.yml'
      - 'backend/**'
      - '.github/workflows/ec2-deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Deploy action
        required: false
        default: full-restart
        type: choice
        options:
          - nginx-reload
          - full-restart
          - git-pull-only

env:
  EC2_HOST: aliyarsolutions.com
  BRANCH: claude/jarvis-cans-api-integration-ZThTD

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Deploy via SSM
        id: ssm
        if: steps.aws_creds.outcome == 'success'
        continue-on-error: true
        run: |
          ACTION="${{ github.event.inputs.action }}"
          ACTION="${ACTION:-full-restart}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ap-south-2 \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text 2>/dev/null | tr '\t' '\n' | head -1)

          echo "EC2 Instance: $INSTANCE_ID"

          if [ -z "$INSTANCE_ID" ]; then
            echo "No running instance found"
            exit 1
          fi

          if [ "$ACTION" = "nginx-reload" ]; then
            CMDS='["set -e","DEPLOY_DIR=/home/ubuntu/devops-docker-project","[ -d /opt/jarvis ] && [ -f /opt/jarvis/infrastructure/docker-compose.yml ] && DEPLOY_DIR=/opt/jarvis || true","cd $DEPLOY_DIR","git fetch origin claude/jarvis-cans-api-integration-ZThTD","git checkout claude/jarvis-cans-api-integration-ZThTD","git pull origin claude/jarvis-cans-api-integration-ZThTD","cd infrastructure","docker compose exec -T nginx nginx -s reload || docker compose restart nginx","curl -sf http://localhost/health && echo HEALTH_OK || echo HEALTH_FAIL"]'
          else
            CMDS='["set -e","DEPLOY_DIR=/home/ubuntu/devops-docker-project","[ -d /opt/jarvis ] && [ -f /opt/jarvis/infrastructure/docker-compose.yml ] && DEPLOY_DIR=/opt/jarvis || true","cd $DEPLOY_DIR","git fetch origin claude/jarvis-cans-api-integration-ZThTD","git checkout claude/jarvis-cans-api-integration-ZThTD","git pull origin claude/jarvis-cans-api-integration-ZThTD","cd infrastructure","docker compose up -d --no-deps --build nginx","sleep 5","docker compose exec -T nginx nginx -s reload 2>/dev/null || true","curl -sf http://localhost/health && echo HEALTH_OK || echo HEALTH_FAIL","curl -sf http://localhost/evolution/ > /dev/null 2>&1 && echo EVOLUTION_OK || echo EVOLUTION_NOT_YET"]'
          fi

          CMD_ID=$(aws ssm send-command \
            --region ap-south-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $CMDS}" \
            --comment "JARVIS nginx deploy" \
            --query "Command.CommandId" \
            --output text 2>/dev/null)

          if [ -z "$CMD_ID" ]; then
            echo "SSM send-command failed (no SSM agent or permissions)"
            exit 1
          fi

          echo "SSM Command: $CMD_ID"
          sleep 20

          RESULT=$(aws ssm get-command-invocation \
            --region ap-south-2 \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json 2>/dev/null || echo '{"Status":"Pending"}')

          echo "Status: $(echo $RESULT | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Status","?"))')"
          echo "Output:"
          echo $RESULT | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StandardOutputContent",""))'

      - name: Deploy via SSH (fallback)
        if: steps.aws_creds.outcome != 'success' || steps.ssm.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e
            DEPLOY_DIR=/home/ubuntu/devops-docker-project
            [ -d /opt/jarvis ] && [ -f /opt/jarvis/infrastructure/docker-compose.yml ] && DEPLOY_DIR=/opt/jarvis || true
            cd $DEPLOY_DIR
            git fetch origin claude/jarvis-cans-api-integration-ZThTD
            git checkout claude/jarvis-cans-api-integration-ZThTD
            git pull origin claude/jarvis-cans-api-integration-ZThTD
            cd infrastructure
            docker compose up -d --no-deps --build nginx
            sleep 5
            docker compose exec -T nginx nginx -s reload 2>/dev/null || true
            curl -sf http://localhost/health && echo "HEALTH OK" || echo "HEALTH FAIL"
            echo "DEPLOY COMPLETE"

      - name: Show manual deploy instructions
        if: always()
        run: |
          echo "============================================"
          echo "JARVIS DEPLOY STATUS"
          echo "SSM: ${{ steps.ssm.outcome }}"
          echo "============================================"
          echo ""
          echo "If automated deploy failed, run from AWS CloudShell:"
          echo ""
          echo "  bash <(curl -s https://raw.githubusercontent.com/syedabrarfff-stack/devops-docker-project/claude/jarvis-cans-api-integration-ZThTD/scripts/cloudshell-deploy.sh)"
          echo ""
          echo "Or SSH: bash /home/ubuntu/devops-docker-project/scripts/jarvis-activate-now.sh"
          echo "============================================"
          echo ""
          echo "Required GitHub secrets for automated deploy:"
          echo "  AWS_ACCESS_KEY_ID — IAM user with EC2+SSM read permissions"
          echo "  AWS_SECRET_ACCESS_KEY — corresponding secret"
          echo "  EC2_SSH_KEY (optional) — SSH private key for fallback"
          echo ""
          echo "Add at: github.com/syedabrarfff-stack/devops-docker-project/settings/secrets/actions"
