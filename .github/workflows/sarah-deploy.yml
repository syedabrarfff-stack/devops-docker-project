name: Sarah — Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "sarah-ai-receptionist/**"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPO_VOICE: sarah-receptionist-voice
  ECR_REPO_API: sarah-receptionist-api
  ECS_CLUSTER: sarah-receptionist-prod
  WORKDIR: sarah-ai-receptionist

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio ruff bandit fakeredis testcontainers[postgres]
      - name: Lint
        run: ruff check app
      - name: Security scan
        run: bandit -r app -ll
      - name: Unit tests
        run: pytest tests/ -v
        working-directory: ${{ env.WORKDIR }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_voice: ${{ steps.image.outputs.voice }}
      image_api: ${{ steps.image.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image (shared by voice + api + worker)
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          # Images are tagged by commit SHA and the ECR repos have tag
          # immutability on (deliberately -- it stops a tag being silently
          # swapped under a running deployment). That means re-running this
          # workflow against a commit that was already pushed once -- a
          # manual re-trigger, a retry after an unrelated infra failure --
          # would otherwise always fail on the push, even though the image
          # is already sitting there unchanged. Check first and skip the
          # rebuild/push instead of treating "already deployed" as an error.
          voice_exists=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO_VOICE }} \
            --image-ids imageTag=$SHA \
            --query 'imageDetails[0].imageTags' --output text 2>/dev/null || echo "")

          if [ -n "$voice_exists" ] && [ "$voice_exists" != "None" ]; then
            echo "Image for $SHA already in ECR -- skipping build/push."
          else
            docker build -f ${{ env.WORKDIR }}/docker/Dockerfile.backend -t $REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA ${{ env.WORKDIR }}
            docker tag $REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA $REGISTRY/${{ env.ECR_REPO_API }}:$SHA
            docker push $REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA
            docker push $REGISTRY/${{ env.ECR_REPO_API }}:$SHA
          fi

          echo "voice=$REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA" >> "$GITHUB_OUTPUT"
          echo "api=$REGISTRY/${{ env.ECR_REPO_API }}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and deploy frontend to S3 + CloudFront
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          cd ${{ env.WORKDIR }}/frontend
          npm ci
          npm run build
          aws s3 sync dist/ s3://sarah-receptionist-prod-frontend/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `--force-new-deployment` alone only restarts a service on whatever
      # image its *existing* task definition already points at -- it does
      # NOT pick up the image build-and-push just pushed. Terraform pins
      # each task definition's image to a fixed tag at apply time, so
      # without this step every deploy after the first would build a new
      # image, push it, and then silently keep running the old one. Register
      # a new task definition revision with the freshly built image first,
      # then point the service at that revision.
      - name: Deploy voice-service
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_voice }}
        run: |
          aws ecs describe-task-definition \
            --task-definition sarah-receptionist-prod-voice \
            --query 'taskDefinition' > voice-task-def.json
          NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            voice-task-def.json)
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sarah-receptionist-prod-voice \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Deploy api-service
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_api }}
        run: |
          aws ecs describe-task-definition \
            --task-definition sarah-receptionist-prod-api \
            --query 'taskDefinition' > api-task-def.json
          NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            api-task-def.json)
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sarah-receptionist-prod-api \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Deploy worker-service
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_api }}
        run: |
          aws ecs describe-task-definition \
            --task-definition sarah-receptionist-prod-worker \
            --query 'taskDefinition' > worker-task-def.json
          NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            worker-task-def.json)
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sarah-receptionist-prod-worker \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Wait for voice-service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services sarah-receptionist-prod-voice

      - name: Wait for api-service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services sarah-receptionist-prod-api

      - name: Post-deploy smoke test
        run: python3 ${{ env.WORKDIR }}/scripts/smoke_test.py
        env:
          SARAH_HEALTH_URL: https://sarah.aliyarsolutions.com/health
