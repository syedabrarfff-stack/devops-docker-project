name: Sarah — Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "sarah-ai-receptionist/**"
  workflow_dispatch: {}

# Two runs landing on the same commit at once (a double-click on "Run
# workflow", or a manual re-trigger overlapping a push-triggered run) used
# to race: both would find the image tag missing, both would build and
# push, and whichever lost the race would fail on ECR's immutable-tag
# rejection -- a real failure caused entirely by concurrency, not by
# anything wrong with the code being deployed. Queue same-ref runs instead
# of letting them race; don't cancel one mid-deploy, since that could leave
# an ECS service mid-rollout with nothing watching it.
concurrency:
  group: sarah-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPO_VOICE: sarah-receptionist-voice
  ECR_REPO_API: sarah-receptionist-api
  ECS_CLUSTER: sarah-receptionist-prod
  WORKDIR: sarah-ai-receptionist

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio ruff bandit fakeredis testcontainers[postgres]
      - name: Lint
        run: ruff check app
      - name: Security scan
        run: bandit -r app -ll
      - name: Unit tests
        run: pytest tests/ -v
        working-directory: ${{ env.WORKDIR }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_voice: ${{ steps.image.outputs.voice }}
      image_api: ${{ steps.image.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image (shared by voice + api + worker)
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          # Images are tagged by commit SHA and the ECR repos have tag
          # immutability on (deliberately -- it stops a tag being silently
          # swapped under a running deployment). That means re-running this
          # workflow against a commit that was already pushed once -- a
          # manual re-trigger, a retry after an unrelated infra failure --
          # would otherwise always fail on the push, even though the image
          # is already sitting there unchanged. Check first and skip the
          # rebuild/push instead of treating "already deployed" as an error.

          if aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO_VOICE }} \
            --image-ids imageTag=$SHA \
            --region ${{ env.AWS_REGION }} \
            &>/dev/null; then
            echo "✓ Image SHA:$SHA already exists in ECR — skipping rebuild"
          else
            echo "⚙ Building image SHA:$SHA (first deploy of this commit)"
            docker build -f ${{ env.WORKDIR }}/docker/Dockerfile.backend -t $REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA ${{ env.WORKDIR }}
            docker tag $REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA $REGISTRY/${{ env.ECR_REPO_API }}:$SHA

            echo "⬆ Pushing image to ECR..."
            docker push $REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA
            docker push $REGISTRY/${{ env.ECR_REPO_API }}:$SHA
            echo "✓ Push complete"
          fi

          echo "voice=$REGISTRY/${{ env.ECR_REPO_VOICE }}:$SHA" >> "$GITHUB_OUTPUT"
          echo "api=$REGISTRY/${{ env.ECR_REPO_API }}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and deploy frontend to S3 + CloudFront
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          cd ${{ env.WORKDIR }}/frontend
          npm ci
          npm run build
          aws s3 sync dist/ s3://sarah-receptionist-prod-frontend/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `--force-new-deployment` alone only restarts a service on whatever
      # image its *existing* task definition already points at -- it does
      # NOT pick up the image build-and-push just pushed. Terraform pins
      # each task definition's image to a fixed tag at apply time, so
      # without this step every deploy after the first would build a new
      # image, push it, and then silently keep running the old one. Register
      # a new task definition revision with the freshly built image first,
      # then point the service at that revision.
      #
      # A service's desiredCount can drift below Terraform's declared
      # minimum (a manual console scale-down, an incident response action
      # that was never reverted) and nothing in this pipeline used to
      # notice -- force-new-deployment happily redeploys a service sitting
      # at 0 tasks, so the deploy goes green while the service serves
      # nothing and the ALB returns 503. Read the Terraform-declared
      # minimum for each service and, ONLY when the current value is below
      # it, pass --desired-count to correct it -- otherwise omit the flag
      # entirely so update-service leaves ECS's live value untouched.
      #
      # This distinction matters: every appautoscaling_target's min_capacity
      # equals this same floor, so Application Auto Scaling itself never
      # drives desiredCount below it -- the only way we ever observe a
      # reading below the floor is exactly the drift this step exists to
      # fix, not a legitimate in-flight scaling action. Earlier this always
      # passed --desired-count "$(max(current, floor))"; if autoscaling
      # scaled a service up between the describe-services read and the
      # update-service write (a real possibility under load, since they're
      # two separate API calls), that unconditional write would silently
      # stomp the scale-up back down to the stale value just read --
      # fighting the exact autoscaling it was meant to leave alone. Omitting
      # the flag in the common case removes that race entirely.
      - name: Deploy voice-service
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_voice }}
          MIN_DESIRED_COUNT: 2 # infra/terraform/environments/prod/variables.tf: ecs_voice_desired_count
        run: |
          aws ecs describe-task-definition \
            --task-definition sarah-receptionist-prod-voice \
            --query 'taskDefinition' > voice-task-def.json
          NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            voice-task-def.json)
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          CURRENT_DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services sarah-receptionist-prod-voice \
            --query 'services[0].desiredCount' --output text)
          DESIRED_COUNT_ARGS=()
          if [ "$CURRENT_DESIRED" -lt "$MIN_DESIRED_COUNT" ]; then
            echo "::warning::voice-service desiredCount was $CURRENT_DESIRED (below the Terraform-declared minimum of $MIN_DESIRED_COUNT) -- correcting to $MIN_DESIRED_COUNT"
            DESIRED_COUNT_ARGS=(--desired-count "$MIN_DESIRED_COUNT")
          fi

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sarah-receptionist-prod-voice \
            --task-definition "$NEW_ARN" \
            "${DESIRED_COUNT_ARGS[@]}" \
            --force-new-deployment

      - name: Deploy api-service
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_api }}
          MIN_DESIRED_COUNT: 2 # infra/terraform/environments/prod/variables.tf: ecs_api_desired_count
        run: |
          aws ecs describe-task-definition \
            --task-definition sarah-receptionist-prod-api \
            --query 'taskDefinition' > api-task-def.json
          NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            api-task-def.json)
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          CURRENT_DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services sarah-receptionist-prod-api \
            --query 'services[0].desiredCount' --output text)
          DESIRED_COUNT_ARGS=()
          if [ "$CURRENT_DESIRED" -lt "$MIN_DESIRED_COUNT" ]; then
            echo "::warning::api-service desiredCount was $CURRENT_DESIRED (below the Terraform-declared minimum of $MIN_DESIRED_COUNT) -- correcting to $MIN_DESIRED_COUNT"
            DESIRED_COUNT_ARGS=(--desired-count "$MIN_DESIRED_COUNT")
          fi

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sarah-receptionist-prod-api \
            --task-definition "$NEW_ARN" \
            "${DESIRED_COUNT_ARGS[@]}" \
            --force-new-deployment

      - name: Deploy worker-service
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_api }}
          MIN_DESIRED_COUNT: 2 # infra/terraform/modules/compute/variables.tf: ecs_worker_desired_count
        run: |
          aws ecs describe-task-definition \
            --task-definition sarah-receptionist-prod-worker \
            --query 'taskDefinition' > worker-task-def.json
          NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            worker-task-def.json)
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          CURRENT_DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services sarah-receptionist-prod-worker \
            --query 'services[0].desiredCount' --output text)
          DESIRED_COUNT_ARGS=()
          if [ "$CURRENT_DESIRED" -lt "$MIN_DESIRED_COUNT" ]; then
            echo "::warning::worker-service desiredCount was $CURRENT_DESIRED (below the Terraform-declared minimum of $MIN_DESIRED_COUNT) -- correcting to $MIN_DESIRED_COUNT"
            DESIRED_COUNT_ARGS=(--desired-count "$MIN_DESIRED_COUNT")
          fi

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sarah-receptionist-prod-worker \
            --task-definition "$NEW_ARN" \
            "${DESIRED_COUNT_ARGS[@]}" \
            --force-new-deployment

      # `aws ecs wait services-stable` has a fixed budget (40 attempts x 15s
      # ~= 10 minutes) NO MATTER HOW MANY --services names you pass it --
      # passing all three here doesn't parallelize with three independent
      # budgets, it makes all three SHARE one 10-minute budget. Confirmed
      # the hard way: this single-call form timed out ("Waiter ServicesStable
      # failed: Max attempts exceeded") on a routine deploy where every
      # service was doing a real rolling replacement (force-new-deployment
      # always registers a fresh task-definition revision, so this happens
      # on every deploy, not just the first one) -- three services'
      # stabilization time added up past the one shared window that three
      # sequential waiters (each with their own full budget) had always
      # comfortably covered. Backgrounding three separate waiter processes
      # gets the actual goal -- running them concurrently -- without
      # collapsing their budgets into one.
      - name: Wait for voice/api/worker service stability
        run: |
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services sarah-receptionist-prod-voice &
          PID_VOICE=$!
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services sarah-receptionist-prod-api &
          PID_API=$!
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services sarah-receptionist-prod-worker &
          PID_WORKER=$!

          FAILED=0
          wait "$PID_VOICE" || { echo "::error::voice-service did not stabilize"; FAILED=1; }
          wait "$PID_API" || { echo "::error::api-service did not stabilize"; FAILED=1; }
          wait "$PID_WORKER" || { echo "::error::worker-service did not stabilize"; FAILED=1; }
          exit "$FAILED"

      - name: Post-deploy smoke test
        run: python3 ${{ env.WORKDIR }}/scripts/smoke_test.py
        env:
          SARAH_HEALTH_URL: https://sarah.aliyarsolutions.com/health
