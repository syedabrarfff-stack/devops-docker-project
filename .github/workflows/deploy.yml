name: JARVIS — Build & Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

env:
  AWS_REGION:   ap-south-2
  ECR_BACKEND:  jarvis-production-backend
  ECR_FRONTEND: jarvis-production-frontend
  ECS_CLUSTER:  jarvis-production-cluster
  ECS_SERVICE:  jarvis-production-backend
  # Node.js 24 compat: remove when aws-actions releases Node.js 24 builds
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  TASK_FAMILY:  jarvis-production-backend
  APP_BASE_URL: https://aliyarsolutions.com
  OIDC_ROLE:    ${{ secrets.AWS_OIDC_ROLE_ARN }}

jobs:
  # ── Build & push Docker images ─────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      backend_image:  ${{ steps.backend.outputs.image }}
      frontend_image: ${{ steps.frontend.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.OIDC_ROLE }}
          role-session-name: JarvisECSBuild
          aws-region:        ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        id: backend
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          TAG:      ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_BACKEND:$TAG"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          docker tag  "$IMAGE" "$REGISTRY/$ECR_BACKEND:latest"
          docker push "$REGISTRY/$ECR_BACKEND:latest"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & push frontend
        id: frontend
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          TAG:      ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_FRONTEND:$TAG"
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"
          docker tag  "$IMAGE" "$REGISTRY/$ECR_FRONTEND:latest"
          docker push "$REGISTRY/$ECR_FRONTEND:latest"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ── Database migrations ────────────────────────────────────────────────────
  migrate:
    name: Run Alembic Migrations
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.OIDC_ROLE }}
          role-session-name: JarvisECSMigrate
          aws-region:        ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run migrations via ECS one-off task
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE:    ${{ needs.build.outputs.backend_image }}
        run: |
          # Get current task definition to inherit network config, subnets, security groups, and secrets
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json)

          SUBNETS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' \
            --output json | tr -d '[]"' | tr ',' ' ')

          SECURITY_GROUPS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' \
            --output json | tr -d '[]"' | tr ',' ' ')

          EXECUTION_ROLE=$(echo "$TASK_DEF" | python3 -c "import sys,json; print(json.load(sys.stdin)['executionRoleArn'])")
          TASK_ROLE=$(echo "$TASK_DEF" | python3 -c "import sys,json; print(json.load(sys.stdin)['taskRoleArn'])")

          # Build migration container definition (override command only)
          MIGRATION_DEF=$(echo "$TASK_DEF" | python3 -c "
          import sys, json
          td = json.load(sys.stdin)
          # Use the backend container but override the command
          container = next(c for c in td['containerDefinitions'] if c['name'] == 'backend')
          container['command'] = ['alembic', 'upgrade', 'head']
          container['essential'] = True
          # Remove frontend dependency if present
          container.pop('dependsOn', None)
          print(json.dumps([container]))
          ")

          # Run one-off migration task
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"backend\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          echo "Waiting for migration to complete…"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`backend`].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Alembic migration failed (exit $EXIT_CODE)"
            exit 1
          fi
          echo "✅ Database migrations applied"

  # ── Deploy to ECS ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS (Hyderabad)
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.OIDC_ROLE }}
          role-session-name: JarvisECSDeploy
          aws-region:        ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            > task-def.json

      - name: Update backend image in task definition
        id: task_def_backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name:  backend
          image:           ${{ needs.build.outputs.backend_image }}

      - name: Update frontend image in task definition
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task_def_backend.outputs.task-definition }}
          container-name:  frontend
          image:           ${{ needs.build.outputs.frontend_image }}

      - name: Deploy to ECS — Blue/Green rolling update
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.task_def.outputs.task-definition }}
          service:                    ${{ env.ECS_SERVICE }}
          cluster:                    ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes:           15

      - name: Post-deploy health validation
        run: |
          echo "Waiting 30s for ECS tasks to stabilise…"
          sleep 30
          HEALTH_URL="${{ env.APP_BASE_URL }}/health"
          READYZ_URL="${{ env.APP_BASE_URL }}/readyz"
          echo "Checking liveness: $HEALTH_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Liveness check failed — HTTP $STATUS"
            exit 1
          fi
          echo "Checking readiness: $READYZ_URL"
          RSTAT=$(curl -s -o /dev/null -w "%{http_code}" "$READYZ_URL" || echo "000")
          if [ "$RSTAT" != "200" ]; then
            echo "::warning::Readiness degraded — HTTP $RSTAT (deployment continues)"
          fi
          echo "✅ JARVIS v$(curl -s $HEALTH_URL | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"version\",\"?\"))') is live"

      - name: Notify Captain — Slack success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ *JARVIS deployed* — \`${{ github.sha }}\` → ECS ap-south-2\\nTriggered by: ${{ github.actor }}\\nURL: ${{ env.APP_BASE_URL }}\"}" || true

      - name: Notify Captain — Slack failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"🚨 *JARVIS deployment FAILED* — \`${{ github.sha }}\`\\nCheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

      - name: Notify Captain — Telegram success
        if: success()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ JARVIS deployed — $(echo '${{ github.sha }}' | cut -c1-8) → ECS ap-south-2" \
            -d "parse_mode=HTML" || true

      - name: Notify Captain — Telegram failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚨 JARVIS deployment FAILED — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

  # ── Terraform plan (PR-only) ───────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.OIDC_ROLE }}
          role-session-name: JarvisTerraformPlan
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var="db_password=placeholder" \
            -var="secret_key=placeholder" \
            -var="captain_password=placeholder" \
            -no-color
        continue-on-error: true
