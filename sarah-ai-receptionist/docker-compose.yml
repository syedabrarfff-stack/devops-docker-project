services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sarah
      POSTGRES_PASSWORD: sarah
      POSTGRES_DB: sarah_receptionist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarah"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://sarah:sarah@postgres:5432/sarah_receptionist
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://sarah:sarah@postgres:5432/sarah_receptionist
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: arq app.workers.worker.WorkerSettings

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
