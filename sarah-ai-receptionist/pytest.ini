[pytest]
# strict mode: any @pytest.mark.asyncio test must be explicitly marked (an
# unmarked one won't be silently skipped, which is the failure mode we want
# to avoid the day someone forgets the decorator on an async test).
asyncio_mode = strict
# suppresses pytest-asyncio's warning about relying on an implicit default
# fixture loop scope; harmless deprecation notice, spelled out here so it
# doesn't grow into a wall of noise per test run.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
