[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # line-too-long — line-length is advisory here, not blocking
    "B008",   # function-call-in-default-argument — FastAPI's Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E", "F", "W", "I", "B"]
"tests/**" = ["B", "E501"]
