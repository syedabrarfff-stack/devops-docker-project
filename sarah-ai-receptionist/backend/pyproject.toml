[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # line-too-long — line-length is advisory here, not blocking
    "B008",   # function-call-in-default-argument — FastAPI's Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E", "F", "W", "I", "B"]
"tests/**" = ["B", "E501"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
# This project has no type coverage yet; treat mypy as best-effort structural
# analysis (imports resolve, no syntax errors), not a type contract.
follow_imports = "silent"
ignore_errors = true
