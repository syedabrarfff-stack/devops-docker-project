global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: captain-slack
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: captain-slack
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: captain-slack
      repeat_interval: 4h

receivers:
  - name: captain-slack
    slack_configs:
      - channel: "#jarvis-alerts"
        username: "JARVIS AlertManager"
        icon_emoji: ":rotating_light:"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨 {{ else }}✅ {{ end }}{{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Severity:* {{ .GroupLabels.severity }}
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Fired at:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]
