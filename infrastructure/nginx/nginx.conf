# ─── Rate Limiting ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m     rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Gzip Compression ─────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name aliyarsolutions.com www.aliyarsolutions.com _;

    client_max_body_size 50M;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name aliyarsolutions.com www.aliyarsolutions.com;

    client_max_body_size 50M;
    limit_conn conn_limit 50;

    ssl_certificate     /etc/letsencrypt/live/aliyarsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliyarsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://aliyarsolutions.com; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy cross-origin always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /control-room/\nDisallow: /api/\nDisallow: /grafana/\nDisallow: /ws\n";
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        access_log off;
    }

    location = / {
        root /var/www/html;
        try_files /index.html =404;
    }

    location = /index.html {
        root /var/www/html;
        try_files /index.html =404;
    }

    location = /aliyar-pdf.html {
        root /var/www/html;
        try_files /aliyar-pdf.html =404;
    }

    location = /aliyar-solutions-aionx.pdf {
        root /var/www/html;
        try_files /aliyar-solutions-aionx.pdf =404;
        add_header Content-Disposition "inline; filename=aliyar-solutions-aionx.pdf";
    }

    location = /control-room {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 /control-room/dashboard;
    }

    location /control-room/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(dashboard|chat|briefing|captain-bridge|approvals|war-room|system-hud|leads|outreach|communications|crm|relationships|proposals|invoices|revenue-intelligence|agents|departments|council|expert-council|memory|intel|intelligence-hub|consciousness|aionx-architecture|discovery|tasks|projects|scheduler|notifications|gmail|voice|knowledge|research|governance|catalog|settings)/?$ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 /control-room$uri;
    }

    # ── Login endpoint — strict rate limit to prevent brute force ─────────────
    location = /api/v1/auth/login {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AWS SNS webhook — publicly accessible, no auth ───────────────────────
    location = /api/v1/webhooks/email/inbound {
        limit_req zone=webhook burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Stripe webhook — publicly accessible, signature-verified by backend ──────
    location = /api/v1/webhooks/stripe {
        limit_req zone=webhook burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Evolution API WhatsApp webhook — publicly accessible for Meta ─────────
    location = /api/v1/webhooks/whatsapp {
        limit_req zone=webhook burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /ws {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Evolution API (WhatsApp) — publicly accessible for Meta callbacks ─────
    location /evolution/ {
        proxy_pass http://evolution:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /grafana/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location / {
        return 404;
    }
}
