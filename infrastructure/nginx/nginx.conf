upstream backend  { server backend:8000; }
upstream frontend { server frontend:80; }

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

server {
    listen 80;
    server_name aliyarsolutions.com www.aliyarsolutions.com;

    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Frame-Options         DENY;
    add_header X-Content-Type-Options  nosniff;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    client_max_body_size 10M;

    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /api/v1/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 180s;
    }

    location = /api/v1/crm/leads {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend/api/v1/leads/?auto_score=false;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl http2;
    server_name aliyarsolutions.com www.aliyarsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/aliyarsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliyarsolutions.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options         DENY;
    add_header X-Content-Type-Options  nosniff;
