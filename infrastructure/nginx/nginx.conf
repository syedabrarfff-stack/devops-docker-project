# ─── Rate Limiting ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m     rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Gzip Compression ─────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ─── Docker DNS resolver — allows lazy resolution of optional upstreams ───────
# 127.0.0.11 is Docker's internal DNS resolver; valid=30s prevents stale caching.
resolver 127.0.0.11 valid=30s ipv6=off;

# ─── HTTP — ACME renewal + internal healthcheck only, everything else redirects ─
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker's healthcheck hits this over plain HTTP (127.0.0.1) — keep it reachable.
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/aliyarsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliyarsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;
    limit_conn conn_limit 50;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # script-src: no unsafe-inline/unsafe-eval — verified against the actual
    # built frontend bundle (no eval()/new Function() anywhere, no inline
    # <script> tags in the HTML shell; React attaches handlers via
    # addEventListener, not inline onclick="" attributes).
    # style-src keeps unsafe-inline — chart libraries (Victory/Recharts)
    # commonly set inline styles for dynamic positioning; removing this
    # without a real-browser verification risks breaking chart rendering.
    # fonts.googleapis.com/fonts.gstatic.com added: index.html loads Google
    # Fonts from there, which the CSP was blocking before this fix.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https:; frame-ancestors 'none';" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /control-room/\nDisallow: /api/\nDisallow: /grafana/\nDisallow: /ws\n";
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        access_log off;
    }

    location = / {
        root /var/www/html;
        try_files /index.html @frontend;
    }

    location = /index.html {
        root /var/www/html;
        try_files /index.html @frontend;
    }

    location @frontend {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /aliyar-pdf.html {
        root /var/www/html;
        try_files /aliyar-pdf.html =404;
    }

    location = /aliyar-solutions-aionx.pdf {
        root /var/www/html;
        try_files /aliyar-solutions-aionx.pdf =404;
        add_header Content-Disposition "inline; filename=aliyar-solutions-aionx.pdf";
    }

    location = /control-room {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 /control-room/dashboard;
    }

    location /control-room/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(dashboard|chat|briefing|captain-bridge|approvals|war-room|system-hud|leads|outreach|communications|crm|relationships|proposals|invoices|revenue-intelligence|agents|departments|council|expert-council|memory|intel|intelligence-hub|consciousness|aionx-architecture|discovery|tasks|projects|scheduler|notifications|gmail|voice|knowledge|research|governance|catalog|settings)/?$ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 /control-room$uri;
    }

    # ── Login endpoint — strict rate limit to prevent brute force ─────────────
    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Public webhooks — no auth, verified by backend ───────────────────────
    location ~ ^/api/v1/webhooks/ {
        limit_req zone=webhook burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /ws {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Evolution API (WhatsApp) — optional service, lazy-resolved ─────────────
    # Unlike Grafana (which is subpath-aware via GF_SERVER_SERVE_FROM_SUB_PATH),
    # Evolution API has no equivalent config and expects requests at its root
    # paths (e.g. /instance/...). proxy_pass with a bare variable (no URI part)
    # forwards the ORIGINAL request URI unmodified — so /evolution/instance/x
    # was being sent upstream as-is instead of being rewritten to /instance/x,
    # causing every request to 404/502. Strip the /evolution/ prefix ourselves
    # before proxying, while keeping the variable form so nginx doesn't fail to
    # start if the evolution container isn't resolvable yet at boot.
    location /evolution/ {
        rewrite ^/evolution/(.*)$ /$1 break;
        set $evo http://evolution:8080;
        proxy_pass $evo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Grafana — optional service, lazy-resolved ─────────────────────────────
    location /grafana/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        set $gf http://grafana:3000;
        proxy_pass $gf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location / {
        return 404;
    }
}
