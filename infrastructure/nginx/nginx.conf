# ── Upstream connection pools ─────────────────────────────────────────────────
upstream backend {
    server backend:8000;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api:10m  rate=60r/m;
limit_req_zone  $binary_remote_addr zone=chat:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ── Logging ────────────────────────────────────────────────────────────────────
log_format main '$remote_addr - [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" rt=$request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options         DENY                            always;
    add_header X-Content-Type-Options  nosniff                         always;
    add_header X-XSS-Protection        "1; mode=block"                 always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(self), camera=()" always;

    # ── Limits ──────────────────────────────────────────────────────────────
    client_max_body_size 50M;
    limit_conn addr 50;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Liveness / readiness probes ─────────────────────────────────────────
    location = /health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        access_log         off;
    }

    location = /readyz {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── API routes ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # Auto-retry on transient backend errors (safe for GET)
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ── Chat endpoint — longer timeout, separate rate limit ─────────────────
    location /api/v1/chat {
        limit_req zone=chat burst=10 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_send_timeout     180s;
        proxy_read_timeout     180s;
    }

    # ── Voice TTS endpoint — larger timeout for audio generation ────────────
    location /api/v1/voice/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
        client_max_body_size   5M;
    }

    # ── WebSocket connection ─────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 5s;
    }

    # ── FastAPI docs ─────────────────────────────────────────────────────────
    location /docs {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    # ── Frontend SPA — catch-all ─────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass   http://frontend;
            expires      30d;
            add_header   Cache-Control "public, immutable";
        }
    }

    # ── Custom error pages ───────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"status":"degraded","message":"JARVIS is restarting — back in a moment."}';
        add_header Content-Type application/json;
    }
}
