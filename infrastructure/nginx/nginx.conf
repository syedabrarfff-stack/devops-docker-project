server {
    listen 80;
    server_name aliyarsolutions.com www.aliyarsolutions.com _;

    client_max_body_size 50M;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name aliyarsolutions.com www.aliyarsolutions.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/aliyarsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliyarsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /control-room/\nDisallow: /api/\nDisallow: /grafana/\nDisallow: /ws\n";
    }

    location = /control-room {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 /control-room/dashboard;
    }

    location /control-room/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(dashboard|chat|briefing|captain-bridge|approvals|war-room|system-hud|leads|outreach|crm|relationships|proposals|invoices|revenue-intelligence|agents|departments|council|expert-council|memory|intel|intelligence-hub|consciousness|aionx-architecture|discovery|tasks|projects|scheduler|notifications|gmail|voice|knowledge|research|governance|catalog|settings)/?$ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 /control-room$uri;
    }

    location /api/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /ws {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /grafana/ {
        auth_basic "Aliyar Control Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
