version: "3.9"

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:
  # ─── Redis ───────────────────────────────────────────────────
  redis:
    <<: *logging
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    <<: *logging
    image: pgvector/pgvector:pg16
    container_name: jarvis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-jarvis}
      POSTGRES_USER:     ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c max_connections=100
      -c work_mem=4MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  # ─── JARVIS Backend ───────────────────────────────────────────
  backend:
    <<: *logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: jarvis_backend:latest
    container_name: jarvis_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-jarvis}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      JARVIS_REPO_DATA_PATH: /jarvis-data
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_INSTANCE_NAME: ${WHATSAPP_INSTANCE_NAME:-jarvis-main}
      WHATSAPP_DISPLAY_IDENTITY: ${WHATSAPP_DISPLAY_IDENTITY:-Joseph David}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY must be set in .env}
      EVOLUTION_PUBLIC_URL: ${EVOLUTION_PUBLIC_URL:-https://aliyarsolutions.com/evolution}
      EVOLUTION_WEBHOOK_URL: http://backend:8000/api/v1/webhooks/whatsapp
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-3}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_TIMEOUT: "240"
      GUNICORN_GRACEFUL_TIMEOUT: "45"
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-bundle.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-bundle.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.crt
      HTTPX_CA_BUNDLE: /etc/ssl/certs/ca-bundle.crt
    volumes:
      - backend_data:/data
      - backup_data:/var/backups/jarvis
      - ../jarvis-data:/jarvis-data
      - /root/.ccr/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 40s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 256M

  # ─── Evolution API (WhatsApp) ─────────────────────────────────
  # AIONX WhatsApp transport layer - Evolution API only, no duplicate CRM/memory logic.
  evolution:
    <<: *logging
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-https://aliyarsolutions.com/evolution}
      DEL_INSTANCE: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme}
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution_api
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      S3_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ 2>/dev/null | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

  frontend:
    <<: *logging
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: jarvis_frontend:latest
    container_name: jarvis_frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M

  # ─── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    <<: *logging
    image: nginx:1.27-alpine
    container_name: jarvis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - ../public-site:/var/www/html:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 32M

  certbot:
    <<: *logging
    image: certbot/certbot:latest
    container_name: jarvis_certbot
    restart: unless-stopped
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/libletsencrypt:/var/lib/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - jarvis_net

  # Prometheus metrics store
  prometheus:
    <<: *logging
    image: prom/prometheus:v2.54.1
    container_name: jarvis_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M

  # Grafana operations dashboards
  grafana:
    <<: *logging
    image: grafana/grafana-oss:11.1.4
    container_name: jarvis_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: "https://aliyarsolutions.com/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M

  alertmanager:
    <<: *logging
    image: prom/alertmanager:v0.27.0
    container_name: jarvis_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ../monitoring/alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  postgres-exporter:
    <<: *logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: jarvis_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jarvis}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis-exporter:
    <<: *logging
    image: oliver006/redis_exporter:v1.62.0
    container_name: jarvis_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # No healthcheck: this image ships only the exporter binary itself —
    # no shell, wget, or curl (verified: `docker export` shows no such
    # binaries anywhere in the image), so there's no way to run a CMD-based
    # check without adding a second process to the container. Restart
    # policy + the depends_on condition above are what protect this one.
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"

  node-exporter:
    <<: *logging
    image: prom/node-exporter:v1.8.2
    container_name: jarvis_node_exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"

  cadvisor:
    <<: *logging
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: jarvis_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

  loki:
    <<: *logging
    image: grafana/loki:3.2.1
    container_name: jarvis_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  promtail:
    <<: *logging
    image: grafana/promtail:3.2.1
    container_name: jarvis_promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jarvis_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  postgres_data:
    name: jarvis_vnext_postgres_data
  redis_data:
    name: jarvis_vnext_redis_data
  prometheus_data:
    name: jarvis_prometheus_data
  grafana_data:
    name: jarvis_grafana_data
  loki_data:
    name: jarvis_loki_data
  backend_data:
    name: jarvis_backend_data
  backup_data:
    name: jarvis_backup_data
  evolution_instances:
    name: jarvis_evolution_instances

networks:
  jarvis_net:
    name: jarvis_network
    driver: bridge
