# JARVIS Production Docker Compose — Unbreakable Configuration
# Memory limits, resource guards, log rotation, healthcheck watchdog.
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose -f infrastructure/docker-compose.prod.yml up -d

version: "3.9"

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    <<: [*restart, *logging]
    image: pgvector/pgvector:pg16
    container_name: jarvis_postgres_prod
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-jarvis}
      POSTGRES_USER:     ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jarvis_prod
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: jarvis_redis_prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-jarvis_redis_secret}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jarvis_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - jarvis_prod
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  # ─── JARVIS Backend ───────────────────────────────────────────────────────
  backend:
    <<: [*restart, *logging]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: jarvis_backend:prod
    container_name: jarvis_backend_prod
    env_file:
      - ../.env
    environment:
      DEBUG:        "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jarvis}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-jarvis_redis_secret}@redis:6379/0
      USE_AWS:      ${USE_AWS:-false}
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - jarvis_prod
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 256M

  # ─── JARVIS Frontend ──────────────────────────────────────────────────────
  frontend:
    <<: [*restart, *logging]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: jarvis_frontend:prod
    container_name: jarvis_frontend_prod
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis_prod
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    container_name: jarvis_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - jarvis_prod
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # ─── Certbot (Let's Encrypt) ──────────────────────────────────────────────
  certbot:
    <<: *restart
    image: certbot/certbot:latest
    container_name: jarvis_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    networks:
      - jarvis_prod

volumes:
  postgres_data:
    name: jarvis_postgres_prod_data
  redis_data:
    name: jarvis_redis_prod_data
  certbot_www:
    name: jarvis_certbot_www
  certbot_conf:
    name: jarvis_certbot_conf

networks:
  jarvis_prod:
    name: jarvis_production_network
    driver: bridge
