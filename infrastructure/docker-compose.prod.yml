# JARVIS Production Docker Compose
# Used for: local production testing, small VPS deployments, pre-ECS validation
# For AWS ECS deployment, use infra/terraform/ instead.
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose -f infrastructure/docker-compose.prod.yml up -d

version: "3.9"

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    container_name: jarvis_postgres_prod
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-jarvis}
      POSTGRES_USER:     ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"           # bind to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis_prod

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: jarvis_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-jarvis_redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jarvis_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jarvis_prod

  # ─── JARVIS Backend ───────────────────────────────────────────────────────
  backend:
    <<: [*restart, *logging]
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
    container_name: jarvis_backend_prod
    env_file:
      - ../.env
    environment:
      DEBUG:        "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jarvis}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-jarvis_redis_secret}@redis:6379/0
      USE_AWS:      ${USE_AWS:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jarvis_prod

  # ─── JARVIS Frontend ──────────────────────────────────────────────────────
  frontend:
    <<: [*restart, *logging]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: jarvis_frontend_prod
    depends_on:
      - backend
    networks:
      - jarvis_prod

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    container_name: jarvis_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - jarvis_prod

  # ─── Certbot (Let's Encrypt — run once to obtain, then auto-renews) ───────
  certbot:
    image: certbot/certbot:latest
    container_name: jarvis_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    networks:
      - jarvis_prod

volumes:
  postgres_data:
    name: jarvis_postgres_prod_data
  redis_data:
    name: jarvis_redis_prod_data
  certbot_www:
    name: jarvis_certbot_www
  certbot_conf:
    name: jarvis_certbot_conf

networks:
  jarvis_prod:
    name: jarvis_production_network
    driver: bridge
