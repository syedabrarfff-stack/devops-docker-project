# GitLeaks Secret Scanning Configuration
# https://github.com/gitleaks/gitleaks
# Run: gitleaks detect --source . -c .gitleaks.toml

title = "JARVIS — Aliyar Solutions Secret Scanner"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic Claude API Key"
regex = '''sk-ant-[a-zA-Z0-9\-_]{40,}'''
tags = ["anthropic", "ai", "critical"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[a-zA-Z0-9]{20,}T3BlbkFJ[a-zA-Z0-9]{20,}'''
tags = ["openai", "ai", "critical"]

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API Key"
regex = '''sk-[a-zA-Z0-9]{32,}'''
tags = ["deepseek", "ai"]

[[rules]]
id = "groq-api-key"
description = "Groq API Key"
regex = '''gsk_[a-zA-Z0-9]{52}'''
tags = ["groq", "ai"]

[[rules]]
id = "google-api-key"
description = "Google / Gemini API Key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["google", "ai"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(AKIA|ASIAIOSFODNN)[A-Z0-9]{16}'''
tags = ["aws", "critical"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''[0-9a-zA-Z/+]{40}'''
entropy = 4.5
tags = ["aws", "critical"]

[[rules]]
id = "paypal-client-secret"
description = "PayPal Client Secret"
regex = '''[A-Za-z0-9_\-]{64,}'''
entropy = 4.0
tags = ["paypal", "payment"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'''
tags = ["slack", "notification"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot Token"
regex = '''[0-9]{8,10}:[a-zA-Z0-9_\-]{35}'''
tags = ["telegram", "notification"]

[[rules]]
id = "database-url-with-password"
description = "Database URL with embedded password"
regex = '''(postgresql|postgres|mysql|redis):\/\/[^:]+:[^@]+@'''
tags = ["database", "critical"]

[allowlist]
description = "Ignore known safe patterns"
regexes = [
    # Placeholder patterns in .env.example and config templates
    '''sk-ant-\.\.\.''',
    '''sk-\.\.\.''',
    '''AIza\.\.\.''',
    '''SECRETS_MANAGER''',
    '''REPLACE_WITH''',
    '''change-this''',
    '''your-domain''',
    '''jarvis_secret''',
    '''jarvis_pass''',
]
paths = [
    '''.env.example''',
    '''config/.env.development''',
    '''config/.env.production''',
    '''CLAUDE.md''',
]
